name: mosaic_sdk
description: Native Mosaic Protocol 0.3 renderer with Local Preview for Flutter.
version: 0.3.0-dev.1
publish_to: none

# Flutter 3.22 / Dart 3.4 is the tested supported floor. It matches the
# `mosaic_revenuecat` adapter, which already required 3.22.
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Provides the application-private directory used by the crash-safe
  # Configuration Delivery cache. The exact pins below remain the minimum
  # versions compatible with the Flutter 3.22 / Dart 3.4 floor, so the v1
  # feature freeze keeps them; newer releases are deliberately not adopted.
  path_provider: 2.1.4
  url_launcher: 6.3.0
  video_player: 2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
