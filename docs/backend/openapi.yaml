          description: Timeline entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/BillingTimelineEntry" } }
                      nextCursor: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/restore-jobs:
    get:
      operationId: listBillingRestoreJobs
      tags: [Billing Customers]
      security: [{ BrowserSession: [] }]
      description: |
        Restore and sync jobs in this Environment, newest first. Mosaic's `outcome` and the native
        `providerOutcome` are separate axes and are never merged: a completed native restore whose
        facts have not reached a snapshot is not restored access. Owner or admin only.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/EnvironmentID" }
        - { in: query, name: billingCustomerId, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Restore jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/BillingRestoreJob" } }
                      nextCursor: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/restore-jobs/{restoreId}:
    get:
      operationId: getBillingRestoreJob
      tags: [Billing Customers]
      security: [{ BrowserSession: [] }]
      description: One restore or sync job's status. Owner or admin only.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/EnvironmentID" }
        - { $ref: "#/components/parameters/RestoreJobID" }
      responses:
        "200": { description: The restore job., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingRestoreJob" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/identity-conflicts:
    get:
      operationId: listOperatorBillingIdentityConflicts
      tags: [Billing Identity Conflicts]
      security: [{ BrowserSession: [] }]
      description: |
        Identity conflicts awaiting or holding an operator decision. They are Project-scoped, not
        Environment-scoped, and the route says so: a conflict is a dispute about who a person is,
        and identity in Mosaic belongs to the Project. Filing it under an Environment would imply
        it could be resolved differently in staging than in production.

        A conflict carries the disputed alias *family* and never the disputed alias digest.
        Owner or admin only.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { in: query, name: status, schema: { type: string, enum: [open, resolved] } }
      responses:
        "200":
          description: Identity conflicts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/OperatorBillingIdentityConflict" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/identity-conflicts/{conflictId}:
    get:
      operationId: getOperatorBillingIdentityConflict
      tags: [Billing Identity Conflicts]
      security: [{ BrowserSession: [] }]
      description: One conflict with the purchase lineage it disputes, which is what an operator needs before choosing a resolution. Owner or admin only.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/IdentityConflictID" }
      responses:
        "200": { description: The conflict., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/OperatorBillingIdentityConflictDetail" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/identity-conflicts/{conflictId}/resolution:
    post:
      operationId: resolveBillingIdentityConflict
      tags: [Billing Identity Conflicts]
      security: [{ BrowserSession: [] }]
      description: |
        Apply an operator's decision and release the freeze.

        The three actions are the whole vocabulary. `keep_existing` awards the disputed subject to
        the incumbent; `reassign_to_candidate` awards it to the challenger the evidence proposed;
        `operator_split` awards it to neither — the operator has decided these are two people and
        the disputed link is removed rather than moved. There is deliberately no automatic-merge
        action: automatic merge remains an ADR checkpoint, not something a control reaches on its
        own.

        `reason` is required. Every action moves committed access for at least one paying
        customer, and the audit entry an investigation reads months later is worth nothing without
        the why. The reason is written to the conflict and to the audit event.

        Resolving unfreezes the disputed subject and reprojects **both** candidates, not only the
        assigned one: whichever customer loses the lineage is the one holding a committed snapshot
        that still grants it. `assignedBillingCustomerId` is optional and, when present, must name
        the party the action already implies — a resolution surface accepting an arbitrary
        customer would be an unaudited "give this purchase to anyone" control.

        Owner or admin only. Audited.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/IdentityConflictID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveIdentityConflictRequest" }
      responses:
        "200": { description: The resolved conflict., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/OperatorBillingIdentityConflict" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/grant-versions:
    get:
      operationId: listProductEntitlementGrantVersions
      tags: [Billing Grant Versions]
      description: |
        The recorded history of what one Product grants, newest version first.

        Grant versions exist because the projection engine selects a version by the **purchase's
        own effective time**, not by "now". Reading the history is therefore how an operator
        answers "why is this customer entitled?" for a purchase made under a rule that has since
        been replaced. Any member of the owning organization may read it: an operator who can see
        a customer's entitlements but not the rule that produced them has been given a fact with
        no explanation.

        Intervals are half-open `[effectiveStart, effectiveEnd)` and abut exactly, so every
        instant is covered by at most one version per Entitlement.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { in: query, name: productId, required: true, schema: { type: string, maxLength: 128 } }
        - { in: query, name: entitlementId, schema: { type: string, maxLength: 128 }, description: Restricts the history to one (Product, Entitlement) pair. }
        - { in: query, name: currentOnly, schema: { type: boolean }, description: Return only the open-ended version in force now. }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: Grant versions., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ProductEntitlementGrantVersion" } } } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      operationId: publishProductEntitlementGrantVersion
      tags: [Billing Grant Versions]
      description: |
        Publish a new immutable grant version. This is the **only** call on this surface that
        changes what a Product grants, and it is deliberately separate from the impact preview:
        previewing is free and repeatable, publishing requires an actor, a `reason`, and an owner
        or admin role, and writes an audit event in the same transaction as the version.

        **Prospective by default (OD-8).** `effectiveStart` must be now or later. Publishing a
        change that silently applies to yesterday is the failure grant versioning exists to
        prevent, so backdating requires `retroactive: true` — and a retroactive version is then
        held to the additive-superset rule: it may add Entitlements or widen access policy, never
        remove or narrow either. Retroactive change is the one operation that can take access
        from a customer who did nothing wrong, so the only retroactive shape Mosaic accepts is the
        one that cannot.

        **Replacement, not edit.** Publishing closes the current version at exactly the new
        version's start, so the two intervals abut: never a gap (which would strand purchases made
        inside it with no applicable grant) and never an overlap (which would make the applicable
        version a function of row order). A proposal that reaches into an interval that has
        already closed is refused with `grant_interval_overlap`.

        **The change is applied, not just recorded.** The same transaction enqueues a reprojection
        for every Billing Customer whose current snapshot cites the Product. A grant version that
        is recorded but never applied is worse than one never published: every surface would
        report the new meaning while every customer kept the old access, and nothing would retry.

        `grantsInPaused` is accepted only so it can be refused: Google's pause never grants access
        and the policy is not overridable. `grantsInBillingRetry` contradicts both providers'
        documentation and requires an organization **owner**.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublishGrantVersionRequest" } } } }
      responses:
        "201": { description: The published grant version., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ProductEntitlementGrantVersion" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/grant-versions/impact-preview:
    post:
      operationId: previewProductEntitlementGrantImpact
      tags: [Billing Grant Versions]
      description: |
        Report what a proposed grant change would touch. **Nothing is written, including the audit
        trail**: an operator comparing three candidate policies before choosing one has not made
        three changes, and an audit trail suggesting otherwise would be worse than none.

        It takes the same body as the publish call, so an operator previews exactly what they are
        about to publish rather than something adjacent to it.

        Every count is from *current* committed state — the snapshot each customer's pointer names,
        not the whole snapshot history. Counting superseded snapshots would report a much larger
        number that no operator action can change, which is the worst possible combination for a
        confirmation dialog. `impactedEntitlements` and `impactedProducts` count everything a
        reprojection of the affected customers would re-derive, not only the pair being changed,
        because that is the actual blast radius of the confirmation being given.

        A preview never refuses a retroactive narrowing; it reports `additiveSuperset: false` with
        the `narrowingCode`, so the operator sees *why* the publish would be rejected before they
        attempt it. It is gated on the publish permission even though it writes nothing: the counts
        describe how much damage the change could do, and an actor who may not make the change has
        no reason to be shown the blast radius.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublishGrantVersionRequest" } } } }
      responses:
        "200": { description: The impact preview., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/GrantVersionImpact" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/grant-versions/{grantVersionId}:
    get:
      operationId: getProductEntitlementGrantVersion
      tags: [Billing Grant Versions]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { in: path, name: grantVersionId, required: true, schema: { type: string } }]
      responses:
        "200": { description: The grant version., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ProductEntitlementGrantVersion" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProductEntitlementGrantVersion
      tags: [Billing Grant Versions]
      description: |
        Always answers `409 grant_version_immutable`. The route exists so the answer is a sentence
        an integrator can act on rather than a bare 405 that reads like a routing mistake.

        A published grant version is a historical fact: the projection engine selects it by the
        purchase's own effective time, so rewriting its policy or moving its boundary would change
        what a customer was entitled to at a moment that has already passed. The database enforces
        this too — the only permitted update to a grant version row is closing an open interval
        once — so no future repository method or migration can bypass it either. `PUT` and
        `DELETE` answer identically.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { in: path, name: grantVersionId, required: true, schema: { type: string } }]
      responses:
        "409": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/webhook-destinations:
    get:
      operationId: listWebhookDestinations
      tags: [Billing Webhooks]
      description: Application webhook destinations for one Environment. No response ever carries a signing secret.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
      responses:
        "200": { description: Destinations., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/WebhookDestination" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWebhookDestination
      tags: [Billing Webhooks]
      description: |
        Register a destination and mint its first signing secret. **The secret is in this
        response and in no other**: Mosaic keeps only the sealed form, so there is no read that
        returns it again.

        The URL is screened under the ADR-0024 SSRF policy at registration and again on every
        delivery attempt: HTTPS only, no redirects, and RFC1918, loopback, link-local (including
        the cloud metadata address), CGNAT, IPv6 unique-local, IPv4-mapped, and unspecified
        addresses refused against the *resolved* address. Operators running Mosaic and their
        application backend on one private network enable
        `MOSAIC_BILLING_WEBHOOK_ALLOW_PRIVATE_DESTINATIONS`; there is deliberately no
        per-destination override.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateWebhookDestinationRequest" } } } }
      responses:
        "201": { description: The destination and its one-time signing secret., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/WebhookDestinationWithSecret" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/webhook-destinations/{destinationId}:
    get:
      operationId: getWebhookDestination
      tags: [Billing Webhooks]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/WebhookDestinationID" }]
      responses:
        "200": { description: The destination., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/WebhookDestination" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWebhookDestination
      tags: [Billing Webhooks]
      description: Change the URL, the enabled event types, or the description. A changed URL is re-screened.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/WebhookDestinationID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateWebhookDestinationRequest" } } } }
      responses:
        "200": { description: The updated destination., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/WebhookDestination" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhookDestination
      tags: [Billing Webhooks]
      description: Remove a destination that has no delivery history. A destination with attempts is disabled rather than deleted, because the attempts are append-only evidence.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/WebhookDestinationID" }]
      responses:
        "204": { description: The destination was removed. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/webhook-destinations/{destinationId}/status:
    post:
      operationId: setWebhookDestinationStatus
      tags: [Billing Webhooks]
      description: |
        Pause, resume, or disable a destination. Mosaic also disables a destination automatically
        after a bounded run of consecutive exhausted deliveries; `autoDisableReason` distinguishes
        that from an operator's own action, so "did Mosaic disable this, or did a person?" is
        answerable without reading prose.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/WebhookDestinationID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetWebhookDestinationStatusRequest" } } } }
      responses:
        "200": { description: The updated destination., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/WebhookDestination" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/webhook-destinations/{destinationId}/secrets:
    get:
      operationId: listWebhookSigningSecrets
      tags: [Billing Webhooks]
      description: Signing-secret metadata. The secret values are sealed and are never returned.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/WebhookDestinationID" }]
      responses:
        "200": { description: Secret metadata., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/WebhookSigningSecretMetadata" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/webhook-destinations/{destinationId}/secrets/rotate:
    post:
      operationId: rotateWebhookSigningSecret
      tags: [Billing Webhooks]
      description: |
        Mint a new signing secret and start an overlap window. During the overlap every delivery
        carries one `v1` element per honoured secret, so a receiver that has adopted the new
        secret and one that has not both verify. `previousSecretHonoredUntil` is when the
        superseded secret stops signing, which is the whole information an integrator needs to
        schedule their own side. Without an overlap, rotating means a simultaneous change on both
        sides or a period of rejected deliveries, and an operator can achieve neither.

        The new secret is displayed once, here. Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/WebhookDestinationID" }]
      responses:
        "201": { description: The new secret and the overlap deadline., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/WebhookDestinationWithSecret" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/webhook-destinations/{destinationId}/secrets/{secretId}/retire:
    post:
      operationId: retireWebhookSigningSecret
      tags: [Billing Webhooks]
      description: |
        End a secret's overlap immediately — the response to a suspected compromise. Retiring the
        last secret that can still sign is refused: a destination with no signing secret would
        send unsigned deliveries, and an unsigned entitlement webhook is an unauthenticated
        instruction to grant access. Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/WebhookDestinationID" }, { in: path, name: secretId, required: true, schema: { type: string } }]
      responses:
        "200": { description: The retired secret's metadata., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/WebhookSigningSecretMetadata" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [Billing Webhooks]
      description: One delivery per (event, destination). A retry is a further attempt on the same delivery, never a new logical event, which is what keeps the event id stable for consumer deduplication.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { in: query, name: environmentId, schema: { type: string } }
        - { in: query, name: eventId, schema: { type: string } }
        - { in: query, name: destinationId, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [pending, succeeded, failed, exhausted, skipped] } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Deliveries., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/webhook-deliveries/{deliveryId}:
    get:
      operationId: getWebhookDelivery
      tags: [Billing Webhooks]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/WebhookDeliveryID" }]
      responses:
        "200": { description: The delivery., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/WebhookDelivery" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/webhook-deliveries/{deliveryId}/attempts:
    get:
      operationId: listWebhookDeliveryAttempts
      tags: [Billing Webhooks]
      description: |
        Append-only attempt history. It is API-facing only — it is never sent to a destination and
        a destination never sees another tenant's attempts — so it carries no URL and no secret.
        `responseExcerpt` is a bounded, control-character-free excerpt of the destination's own
        response, kept only so an integrator can see why their endpoint refused; it is never
        parsed and never influences Mosaic state.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/WebhookDeliveryID" }]
      responses:
        "200": { description: Attempts., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/WebhookDeliveryAttempt" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/webhook-deliveries/{deliveryId}/replay:
    post:
      operationId: replayWebhookDelivery
      tags: [Billing Webhooks]
      description: |
        Re-queue an exhausted or failed delivery. It reuses the same delivery row and the same
        event id, appending a further attempt: a receiver deduplicating on event id still sees
        the change once. `202` — the delivery is queued, not performed; the worker owns the
        attempt. Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/WebhookDeliveryID" }]
      responses:
        "202": { description: The delivery was queued., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/WebhookDelivery" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/reconciliation-runs:
    get:
      operationId: listReconciliationRuns
      tags: [Billing Operations]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/BillingCursor" }, { $ref: "#/components/parameters/Limit" }, { in: query, name: status, schema: { type: string, enum: [queued, leased, completed, partial, failed] } }]
      responses: { "200": { description: Reconciliation runs., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ReconciliationRun" } }, nextCursor: { type: string } } } } } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
    post:
      operationId: createReconciliationRun
      tags: [Billing Operations]
      description: |
        Start a bounded, restart-safe reconciliation pass. Reconciliation validates provider
        facts and does not calculate customer access. The window may not exceed 180 days,
        which is Apple's own notification-history retention. Owner or admin only. Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateReconciliationRunRequest" } } } }
      responses: { "202": { description: Reconciliation queued., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ReconciliationRun" } } } } } }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/billing/replay-jobs:
    get:
      operationId: listReplayJobs
      tags: [Billing Operations]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/BillingCursor" }, { $ref: "#/components/parameters/Limit" }, { in: query, name: status, schema: { type: string, enum: [queued, leased, completed, failed] } }]
      responses: { "200": { description: Replay jobs., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ReplayJob" } }, nextCursor: { type: string } } } } } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
    post:
      operationId: createReplayJob
      tags: [Billing Operations]
      description: |
        Re-run accepted inputs deterministically. Replay appends new Validation Attempts and
        never rewrites prior attempts or facts: an unchanged outcome recomputes the same fact
        digest and writes nothing, a changed outcome appends a new fact beside the old one,
        and no customer access can change because no access state exists. Owner or admin only.
        Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateReplayJobRequest" } } } }
      responses: { "202": { description: Replay queued., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ReplayJob" } } } } } }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/billing/quarantine/{recordId}:
    get:
      operationId: getQuarantineRecord
      tags: [Billing Operations]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/QuarantineRecordID" }]
      responses: { "200": { $ref: "#/components/responses/QuarantineRecord" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/billing/quarantine/{recordId}/retry:
    post:
      operationId: retryQuarantinedInput
      tags: [Billing Operations]
      description: |
        Re-queue a quarantined input for validation, typically after repairing a Product
        mapping. This is the only recovery action that can lead to a Transaction Fact, and it
        leads there only by asking the store again: the record is closed only by a subsequent
        successful attempt, which is recorded as the justification. There is deliberately no
        endpoint that marks a quarantined input valid. Owner or admin only. Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/QuarantineRecordID" }]
      responses: { "202": { $ref: "#/components/responses/QuarantineRecord" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/billing/quarantine/{recordId}/close-superseded:
    post:
      operationId: closeQuarantineRecordSuperseded
      tags: [Billing Operations]
      description: |
        Close a record because a later record replaced it. It asserts nothing about the
        original input's authenticity and produces no Transaction Fact. Owner or admin only.
        Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/QuarantineRecordID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [supersededByRecordId], properties: { supersededByRecordId: { type: string } } } } } }
      responses: { "200": { $ref: "#/components/responses/QuarantineRecord" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: mosaic_session
      description: Opaque HttpOnly SameSite=Lax browser session. Cross-origin dashboard requests use credentials mode include.
    PublicSDKKey:
      type: http
      scheme: bearer
      bearerFormat: Mosaic public SDK key
    ServerSecretKey:
      type: http
      scheme: bearer
      bearerFormat: Mosaic secret server key
    CustomerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: Mosaic Customer Access Token (mcat_ + 43 base64url characters)
      description: |
        Opaque bearer credential scoping a read to one Billing Customer. It has no claims and
        no parseable structure; Mosaic stores only its SHA-256 digest. It is presented together
        with the public SDK key in Mosaic-SDK-Key, and the two must agree on Project and
        Environment.
  parameters:
    Cursor:
      in: query
      name: cursor
      description: Opaque cursor from the immediately preceding list response. Malformed or stale values return validation_failed.
      schema: { type: string }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    OrganizationID: { in: path, name: organizationId, required: true, schema: { type: string } }
    ActorID: { in: path, name: actorId, required: true, schema: { type: string } }
    ProjectID: { in: path, name: projectId, required: true, schema: { type: string } }
    WebhookDestinationID: { in: path, name: destinationId, required: true, schema: { type: string } }
    WebhookDeliveryID: { in: path, name: deliveryId, required: true, schema: { type: string } }
    EnvironmentID: { in: path, name: environmentId, required: true, schema: { type: string } }
    BillingCustomerID: { in: path, name: customerId, required: true, schema: { type: string } }
    SubscriptionInstanceID: { in: path, name: instanceId, required: true, schema: { type: string } }
    RestoreJobID: { in: path, name: restoreId, required: true, schema: { type: string } }
    IdentityConflictID: { in: path, name: conflictId, required: true, schema: { type: string } }
    ApplicationID: { in: path, name: applicationId, required: true, schema: { type: string } }
    ProviderConnectionID: { in: path, name: connectionId, required: true, schema: { type: string } }
    ProviderMappingID: { in: path, name: mappingId, required: true, schema: { type: string } }
    BillingCursor:
      in: query
      name: cursor
      description: |
        Opaque cursor from the immediately preceding list response. Forward it unchanged; do not
        construct or parse one — it encodes both the ordering timestamp and the row id, because
        billing identifiers are not time-ordered and an id alone cannot express a position in a
        timestamp ordering.

        A malformed or stale value starts from the first page rather than erroring, so a mangled
        cursor cannot silently truncate a list. Omit it for the first page; a response with no
        `nextCursor` is the last page.
      schema: { type: string }
    StoreCredentialID: { in: path, name: credentialId, required: true, schema: { type: string } }
    QuarantineRecordID: { in: path, name: recordId, required: true, schema: { type: string } }
    BillingProviderFilter: { in: query, name: provider, schema: { type: string, enum: [app_store, google_play] } }
    BillingFrom: { in: query, name: from, schema: { type: string, format: date-time } }
    BillingTo: { in: query, name: to, schema: { type: string, format: date-time } }
    APIKeyID: { in: path, name: apiKeyId, required: true, schema: { type: string } }
    PlanID: { in: path, name: planId, required: true, schema: { type: string } }
    ProductID: { in: path, name: productId, required: true, schema: { type: string } }
