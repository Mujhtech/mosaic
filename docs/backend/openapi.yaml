      properties:
        role: { $ref: "#/components/schemas/Role" }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [organizationId, key, name]
      properties:
        organizationId: { type: string }
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required: [name, platform, identifier]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        platform: { $ref: "#/components/schemas/Platform" }
        identifier: { type: string, minLength: 3, maxLength: 255 }
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/APIKeyKind" }
    CreateCatalogResourceRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
