  /v1/products/{productId}/entitlements/{entitlementId}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
      - $ref: "#/components/parameters/EntitlementID"
    delete:
      operationId: removeProductEntitlement
      tags: [Entitlements]
      responses:
        "204": { description: Entitlement grant removed. }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/assets:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      operationId: listAssets
      tags: [Assets]
      responses:
        "200": { $ref: "#/components/responses/AssetList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadAsset
      tags: [Assets]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { $ref: "#/components/responses/Asset" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/assets/{assetId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/AssetID" }
    get:
      operationId: getAsset
      tags: [Assets]
      responses:
        "200": { $ref: "#/components/responses/Asset" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: archiveAsset
      tags: [Assets]
      description: Archives authoring use while retaining immutable bytes for historical releases.
      responses:
        "200": { $ref: "#/components/responses/Asset" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/assets/{assetId}/usage:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/AssetID" }
    get:
      operationId: getAssetUsage
      tags: [Assets]
      responses:
        "200": { $ref: "#/components/responses/AssetUsage" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/paywalls:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      operationId: listPaywalls
      tags: [Paywalls]
      responses:
        "200": { $ref: "#/components/responses/PaywallList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPaywall
      tags: [Paywalls]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePaywallRequest" } } } }
      responses:
        "201": { $ref: "#/components/responses/Paywall" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/paywalls/{paywallId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/PaywallID" }
    get:
      operationId: getPaywall
      tags: [Paywalls]
      responses:
        "200": { $ref: "#/components/responses/Paywall" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePaywall
      tags: [Paywalls]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdatePaywallRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Paywall" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/paywalls/{paywallId}/drafts:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/PaywallID" }
    post:
      operationId: createPaywallDraft
      tags: [Paywall Drafts]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateDraftRequest" } } } }
      responses:
        "201": { $ref: "#/components/responses/Draft" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/paywalls/{paywallId}/drafts/active:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/PaywallID" }
      - { in: query, name: environmentId, required: true, schema: { type: string } }
    get:
      operationId: getActivePaywallDraft
      description: Returns the active Draft for this Paywall and Environment so Studio can recover hosted work after reload.
      tags: [Paywall Drafts]
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/paywalls/{paywallId}/drafts/{draftId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/PaywallID" }
      - { $ref: "#/components/parameters/DraftID" }
    get:
      operationId: getPaywallDraft
      tags: [Paywall Drafts]
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updatePaywallDraft
      tags: [Paywall Drafts]
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateDraftRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Draft" }
        "412": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/paywalls/{paywallId}/drafts/{draftId}/validate:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/PaywallID" }
      - { $ref: "#/components/parameters/DraftID" }
    post:
      operationId: validatePaywallDraft
      tags: [Paywall Drafts]
      responses:
        "200": { $ref: "#/components/responses/ValidationSummary" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/paywalls/{paywallId}/versions:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/PaywallID" }
    get:
      operationId: listPaywallVersions
      tags: [Paywall Versions]
      responses:
        "200": { $ref: "#/components/responses/PaywallVersionList" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/paywalls/{paywallId}/versions/{versionId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/PaywallID" }
      - { $ref: "#/components/parameters/VersionID" }
    get:
      operationId: getPaywallVersion
      tags: [Paywall Versions]
      responses:
        "200": { $ref: "#/components/responses/PaywallVersion" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/paywalls/{paywallId}/versions/{versionId}/drafts:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/PaywallID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      operationId: clonePaywallVersionToDraft
      tags: [Paywall Versions]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201": { $ref: "#/components/responses/Draft" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/placements:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      operationId: listPlacements
      tags: [Placements]
      responses:
        "200": { $ref: "#/components/responses/PlacementList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPlacement
      tags: [Placements]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePlacementRequest" } } } }
      responses:
        "201": { $ref: "#/components/responses/Placement" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/placements/{placementId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/PlacementID" }
    patch:
      operationId: updatePlacement
      tags: [Placements]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdatePlacementRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Placement" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/binding:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/EnvironmentID" }
      - { $ref: "#/components/parameters/PlacementID" }
    get:
      operationId: getPlacementBinding
      tags: [Placements]
      responses:
        "200": { $ref: "#/components/responses/PlacementBinding" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: bindPlacement
      tags: [Placements]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BindPlacementRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/PlacementBinding" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/publish:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/EnvironmentID" }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      operationId: publishConfiguration
      tags: [Publishing]
      description: |
        Production publishing validates each referenced Product for every Application
        in the Project using the explicit Environment, Application platform, active
        provider assignment, healthy production connection, active mapping, availability,
        and fresh metadata snapshot. It never falls back to legacy Product readiness.
        Development and staging preserve the same findings as warnings.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublishRequest" } } } }
      responses:
        "201": { $ref: "#/components/responses/PublishResult" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/releases:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/EnvironmentID" }
    get:
      operationId: listConfigurationReleases
      tags: [Publishing]
      responses:
        "200": { $ref: "#/components/responses/ReleaseList" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/releases/{releaseId}/rollback:
    parameters:
      - { $ref: "#/components/parameters/ProjectID" }
      - { $ref: "#/components/parameters/EnvironmentID" }
      - { $ref: "#/components/parameters/ReleaseID" }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      operationId: rollbackConfigurationRelease
      tags: [Publishing]
      responses:
        "201": { $ref: "#/components/responses/Release" }
        default: { $ref: "#/components/responses/Error" }
  /v1/sdk/configuration:
    get:
      operationId: getSDKConfiguration
      tags: [SDK Configuration]
      security: [{ PublicSDKKey: [] }]
      parameters:
        - { in: header, name: Mosaic-SDK-Platform, required: true, schema: { type: string, enum: [flutter, ios, android] } }
        - { in: header, name: Mosaic-SDK-Version, required: true, schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:[-+][A-Za-z0-9.-]+)?$" } }
        - { in: header, name: Mosaic-Configuration-Versions, required: true, schema: { type: string, const: "1" } }
        - { in: header, name: Mosaic-Paywall-Protocol-Versions, required: true, schema: { type: string, const: "0.2" } }
        - in: header
          name: Mosaic-Paywall-Capabilities
          required: true
          description: Comma-separated unique exact Protocol capability pairs (`name@0.2`), bounded to 128 pairs. The selected Release is returned only when every required pair is reported.
          schema: { type: string, minLength: 1, maxLength: 16384, example: "component.text@0.2,layout.stack@0.2" }
        - { in: header, name: Mosaic-App-Version, required: false, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { in: header, name: If-None-Match, required: false, schema: { type: string } }
      responses:
        "200":
          description: Complete immutable Configuration Delivery v1 envelope.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
            Vary: { schema: { type: string } }
          content:
            application/vnd.mosaic.configuration+json:
              schema: { type: object, additionalProperties: true }
        "304": { description: The current selected representation is unchanged. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "406": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sdk/assets/{assetId}/{contentDigest}:
    parameters:
      - { $ref: "#/components/parameters/AssetID" }
      - in: path
        name: contentDigest
        required: true
        schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    get:
      security: []
      operationId: getAssetContent
      tags: [Assets]
      description: Public immutable Asset bytes. The URL contains no storage key or credential.
      responses:
        "200":
          description: Immutable Asset content.
          headers:
            Cache-Control: { schema: { type: string, const: "public, max-age=31536000, immutable" } }
            ETag: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: mosaic_session
      description: Opaque HttpOnly SameSite=Lax browser session. Cross-origin dashboard requests use credentials mode include.
    PublicSDKKey:
      type: http
      scheme: bearer
      bearerFormat: Mosaic public SDK key
  parameters:
    Cursor:
      in: query
      name: cursor
      description: Opaque cursor from the immediately preceding list response. Malformed or stale values return validation_failed.
      schema: { type: string }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    OrganizationID: { in: path, name: organizationId, required: true, schema: { type: string } }
    ActorID: { in: path, name: actorId, required: true, schema: { type: string } }
    ProjectID: { in: path, name: projectId, required: true, schema: { type: string } }
    EnvironmentID: { in: path, name: environmentId, required: true, schema: { type: string } }
    ApplicationID: { in: path, name: applicationId, required: true, schema: { type: string } }
    ProviderConnectionID: { in: path, name: connectionId, required: true, schema: { type: string } }
    ProviderMappingID: { in: path, name: mappingId, required: true, schema: { type: string } }
    APIKeyID: { in: path, name: apiKeyId, required: true, schema: { type: string } }
    PlanID: { in: path, name: planId, required: true, schema: { type: string } }
    ProductID: { in: path, name: productId, required: true, schema: { type: string } }
    EntitlementID: { in: path, name: entitlementId, required: true, schema: { type: string } }
    PaywallID: { in: path, name: paywallId, required: true, schema: { type: string } }
    DraftID: { in: path, name: draftId, required: true, schema: { type: string } }
    VersionID: { in: path, name: versionId, required: true, schema: { type: string } }
    PlacementID: { in: path, name: placementId, required: true, schema: { type: string } }
    AssetID: { in: path, name: assetId, required: true, schema: { type: string } }
    ReleaseID: { in: path, name: releaseId, required: true, schema: { type: string } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    IfMatch: { in: header, name: If-Match, required: true, schema: { type: string } }
  responses:
    Error:
      description: Stable machine-readable failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Organization: { description: Organization, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationEnvelope" } } } }
    OrganizationList: { description: Organizations, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationListEnvelope" } } } }
    Membership: { description: Membership, content: { application/json: { schema: { $ref: "#/components/schemas/MembershipEnvelope" } } } }
    MembershipList: { description: Memberships, content: { application/json: { schema: { $ref: "#/components/schemas/MembershipListEnvelope" } } } }
    Project: { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectEnvelope" } } } }
    ProjectList: { description: Projects, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectListEnvelope" } } } }
    Application: { description: Application, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationEnvelope" } } } }
    ApplicationList: { description: Applications, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationListEnvelope" } } } }
    Environment: { description: Environment, content: { application/json: { schema: { $ref: "#/components/schemas/EnvironmentEnvelope" } } } }
    EnvironmentList: { description: Environments, content: { application/json: { schema: { $ref: "#/components/schemas/EnvironmentListEnvelope" } } } }
    ProviderConnection: { description: Non-secret Provider Connection metadata, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderConnectionEnvelope" } } } }
    ProviderConnectionList: { description: Non-secret Provider Connections, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderConnectionListEnvelope" } } } }
    ProviderAssignment: { description: Active provider assignment, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderAssignmentEnvelope" } } } }
    ProviderReadiness: { description: Scoped provider readiness and stable recovery codes, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderReadinessEnvelope" } } } }
    APIKey: { description: API key metadata, content: { application/json: { schema: { $ref: "#/components/schemas/APIKeyEnvelope" } } } }
    APIKeyList: { description: API keys without secrets, content: { application/json: { schema: { $ref: "#/components/schemas/APIKeyListEnvelope" } } } }
    APIKeySecret: { description: One-time secret result, content: { application/json: { schema: { $ref: "#/components/schemas/APIKeySecretEnvelope" } } } }
    Plan: { description: Plan, content: { application/json: { schema: { $ref: "#/components/schemas/PlanEnvelope" } } } }
    PlanList: { description: Plans, content: { application/json: { schema: { $ref: "#/components/schemas/PlanListEnvelope" } } } }
    PlanProduct: { description: Plan membership, content: { application/json: { schema: { $ref: "#/components/schemas/PlanProductEnvelope" } } } }
    Product: { description: Product, content: { application/json: { schema: { $ref: "#/components/schemas/ProductEnvelope" } } } }
    ProductList: { description: Products, content: { application/json: { schema: { $ref: "#/components/schemas/ProductListEnvelope" } } } }
    ProductUsage: { description: Product usage, content: { application/json: { schema: { $ref: "#/components/schemas/ProductUsageEnvelope" } } } }
    ProductReadiness: { description: Product readiness, content: { application/json: { schema: { $ref: "#/components/schemas/ProductReadinessEnvelope" } } } }
    ProviderMapping: { description: Placeholder mapping, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderMappingEnvelope" } } } }
    ProviderMappingList: { description: Placeholder mappings, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderMappingListEnvelope" } } } }
    Entitlement: { description: Entitlement definition, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementEnvelope" } } } }
    EntitlementList: { description: Entitlement definitions, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementListEnvelope" } } } }
    ProductEntitlementGrant: { description: Product grant, content: { application/json: { schema: { $ref: "#/components/schemas/ProductEntitlementGrantEnvelope" } } } }
    AuditEventList: { description: Audit events, content: { application/json: { schema: { $ref: "#/components/schemas/AuditEventListEnvelope" } } } }
    Paywall: { description: Paywall, content: { application/json: { schema: { $ref: "#/components/schemas/PaywallEnvelope" } } } }
    PaywallList: { description: Paywalls, content: { application/json: { schema: { $ref: "#/components/schemas/PaywallListEnvelope" } } } }
    Draft:
      description: Hosted Draft and current immutable revision document.
      headers: { ETag: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/DraftEnvelope" } } }
    ValidationSummary: { description: Draft validation, content: { application/json: { schema: { $ref: "#/components/schemas/ValidationSummaryEnvelope" } } } }
    PaywallVersion: { description: Immutable Paywall Version, content: { application/json: { schema: { $ref: "#/components/schemas/PaywallVersionEnvelope" } } } }
    PaywallVersionList: { description: Immutable Paywall Versions, content: { application/json: { schema: { $ref: "#/components/schemas/PaywallVersionListEnvelope" } } } }
    Placement: { description: Placement, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementEnvelope" } } } }
    PlacementList: { description: Placements, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementListEnvelope" } } } }
    PlacementBinding: { description: Environment Placement binding, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementBindingEnvelope" } } } }
    Asset: { description: Hosted Asset metadata, content: { application/json: { schema: { $ref: "#/components/schemas/AssetEnvelope" } } } }
    AssetList: { description: Hosted Assets, content: { application/json: { schema: { $ref: "#/components/schemas/AssetListEnvelope" } } } }
    AssetUsage: { description: Hosted Asset reference counts, content: { application/json: { schema: { $ref: "#/components/schemas/AssetUsageEnvelope" } } } }
    UserSession:
      description: Authenticated browser user. Login and signup also set the session cookie.
      content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
    Release: { description: Immutable Configuration Release metadata, content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseEnvelope" } } } }
    ReleaseList: { description: Configuration Release history, content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseListEnvelope" } } } }
    PublishResult: { description: Publication result and nonblocking warnings, content: { application/json: { schema: { $ref: "#/components/schemas/PublishResultEnvelope" } } } }
  schemas:
    Timestamp: { type: string, format: date-time }
    Page:
      type: object
      additionalProperties: false
      properties:
        nextCursor: { type: string }
    Role: { type: string, enum: [owner, admin, member] }
    ProjectStatus: { type: string, enum: [active, archived] }
    Platform: { type: string, enum: [ios, android] }
    APIKeyKind: { type: string, enum: [public_sdk, secret_server] }
    ProductType: { type: string, enum: [subscription, one_time_non_consumable] }
    ProductStatus: { type: string, enum: [draft, connected, attention_required, archived] }
    MetadataSource: { type: string, enum: [mock, provider] }
    ProviderKind: { type: string, enum: [revenuecat, app_store, google_play, custom] }
    ProviderConnectionKind: { type: string, enum: [revenuecat, custom] }
    ProviderIntegrationMode: { type: string, enum: [server_connected, sdk_only] }
    ProviderConnectionMode: { type: string, enum: [sandbox, production] }
    ProviderConnectionStatus: { type: string, enum: [pending, active, revoked] }
    ProviderHealthStatus: { type: string, enum: [untested, healthy, degraded, unavailable, revoked] }
    EnvironmentMode: { type: string, enum: [development, staging, production] }
    ProviderMappingStatus: { type: string, enum: [placeholder, draft, active, attention_required, archived] }
    ProviderAvailability: { type: string, enum: [unknown, available, unavailable] }
    ProviderSyncState: { type: string, enum: [never_synced, current, stale, failed] }
    ProviderErrorCode:
      type: string
      enum:
        - credentialInvalid
        - credentialExpired
        - permissionDenied
        - connectionRevoked
        - scopeMismatch
        - modeMismatch
        - rateLimited
        - timeout
        - providerUnavailable
        - invalidResponse
        - productNotFound
        - productUnavailable
        - mappingMissing
        - mappingAmbiguous
        - syncInProgress
        - syncPartial
        - syncFailed
        - metadataStale
        - idempotencyConflict
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, name, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        name: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, format: password, minLength: 12, maxLength: 72 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, format: password, minLength: 1, maxLength: 72 }
    CreatePaywallRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties: { key: { type: string, minLength: 2, maxLength: 63 }, name: { type: string, minLength: 1, maxLength: 120 } }
    UpdatePaywallRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 120 } }
    CreateDraftRequest:
      type: object
      additionalProperties: false
      required: [environmentId, document]
      properties:
        environmentId: { type: string }
        sourceVersionId: { type: string }
        document: { type: object, additionalProperties: true }
    UpdateDraftRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties: { document: { type: object, additionalProperties: true } }
    CreatePlacementRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { type: string, minLength: 2, maxLength: 63 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    UpdatePlacementRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    BindPlacementRequest:
      type: object
      additionalProperties: false
      required: [paywallId]
      properties: { paywallId: { type: string } }
    PublishRequest:
      type: object
      additionalProperties: false
      required: [draftId, expectedRevision, acknowledgeMockProducts]
      properties:
        draftId: { type: string }
        expectedRevision: { type: integer, minimum: 1 }
        acknowledgeMockProducts: { type: boolean }
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    UpdateOrganizationRequest: { $ref: "#/components/schemas/CreateOrganizationRequest" }
    UpdateNameRequest: { $ref: "#/components/schemas/CreateOrganizationRequest" }
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [actorId, role]
      properties:
        actorId: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [organizationId, key, name]
      properties:
        organizationId: { type: string }
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required: [name, platform, identifier]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        platform: { $ref: "#/components/schemas/Platform" }
        identifier: { type: string, minLength: 3, maxLength: 255 }
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/APIKeyKind" }
    CreateCatalogResourceRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [key, internalName, type]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{1,62}$" }
        internalName: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        type: { $ref: "#/components/schemas/ProductType" }
    ProductReferenceRequest:
      type: object
      additionalProperties: false
      required: [productId]
      properties:
        productId: { type: string }
    EntitlementReferenceRequest:
      type: object
      additionalProperties: false
      required: [entitlementId]
      properties:
        entitlementId: { type: string }
    CreateProviderMappingRequest:
      type: object
      additionalProperties: false
      required: [applicationId, provider, providerProductIdentifier]
      properties:
        applicationId: { type: string }
        provider: { $ref: "#/components/schemas/ProviderKind" }
        providerProductIdentifier: { type: string, minLength: 1, maxLength: 255 }
    SetEnvironmentModeRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/EnvironmentMode" }
    CreateProviderConnectionRequest:
      type: object
      additionalProperties: false
      description: Non-secret metadata only. Credential, token, secret, and authorization-code properties are unsupported.
      required: [name, provider, integrationMode, mode, environmentIds, applicationIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        provider: { $ref: "#/components/schemas/ProviderConnectionKind" }
        integrationMode: { $ref: "#/components/schemas/ProviderIntegrationMode" }
        mode: { $ref: "#/components/schemas/ProviderConnectionMode" }
        externalProjectId: { type: string, maxLength: 255 }
        environmentIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }
        applicationIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }
    ReplaceProviderConnectionScopesRequest:
      type: object
      additionalProperties: false
      required: [environmentIds, applicationIds]
      properties:
        environmentIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }
        applicationIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string } }
    SetProviderAssignmentRequest:
      type: object
      additionalProperties: false
      required: [connectionId]
      properties:
        connectionId: { type: string }
        acknowledgeProductionConnectionUse:
          type: boolean
          default: false
          description: Required when explicitly assigning a production connection outside a production Environment.
    CreateProviderMappingDraftRequest:
      type: object
      additionalProperties: false
      description: |
        providerProductIdentifier is copied unchanged into Commerce Provider Contract
        providerProductReference for the selected adapter. Package and Offering identifiers
        are optional RevenueCat metadata and must be supplied together; custom providers
        cannot receive them.
      required: [connectionId, environmentId, applicationId, providerProductIdentifier]
      properties:
        connectionId: { type: string }
        environmentId: { type: string }
        applicationId: { type: string }
        providerProductIdentifier:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ".*\\S.*"
          description: Opaque adapter-owned value mapped exactly to Commerce Provider Contract providerProductReference.
        providerPackageIdentifier:
          type: string
          maxLength: 255
          pattern: ".*\\S.*"
          description: RevenueCat-only metadata; requires providerOfferingIdentifier.
        providerOfferingIdentifier:
          type: string
          maxLength: 255
          pattern: ".*\\S.*"
          description: RevenueCat-only metadata; requires providerPackageIdentifier.
        expectedStoreProductId: { type: string, maxLength: 255, pattern: ".*\\S.*" }
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    Membership:
      type: object
      additionalProperties: false
      required: [organizationId, actorId, role, createdAt, updatedAt]
      properties:
        organizationId: { type: string }
        actorId: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    Project:
      type: object
      additionalProperties: false
      required: [id, organizationId, key, name, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        key: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        archivedAt: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    Application:
      type: object
      additionalProperties: false
      required: [id, projectId, name, platform, identifier, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        identifier: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    Environment:
      type: object
      additionalProperties: false
      required: [id, projectId, key, name, mode, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        key: { type: string }
        name: { type: string }
        mode: { $ref: "#/components/schemas/EnvironmentMode" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    ProviderConnection:
      type: object
      additionalProperties: false
      description: Contains no provider credential, token, secret, nonce, or ciphertext.
      required: [id, projectId, name, provider, integrationMode, mode, status, healthStatus, environmentIds, applicationIds, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        provider: { $ref: "#/components/schemas/ProviderConnectionKind" }
        integrationMode: { $ref: "#/components/schemas/ProviderIntegrationMode" }
        mode: { $ref: "#/components/schemas/ProviderConnectionMode" }
        status: { $ref: "#/components/schemas/ProviderConnectionStatus" }
        healthStatus: { $ref: "#/components/schemas/ProviderHealthStatus" }
        externalProjectId: { type: string }
        environmentIds: { type: array, items: { type: string } }
        applicationIds: { type: array, items: { type: string } }
        lastSuccessfulTestAt: { $ref: "#/components/schemas/Timestamp" }
        lastSuccessfulSyncAt: { $ref: "#/components/schemas/Timestamp" }
        lastErrorCode: { $ref: "#/components/schemas/ProviderErrorCode" }
        revokedAt: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    ActiveProviderAssignment:
      type: object
      additionalProperties: false
      required: [projectId, environmentId, applicationId, platform, connectionId, productionConnectionUseAcknowledged, createdByActorId, createdAt, updatedAt]
      properties:
        projectId: { type: string }
        environmentId: { type: string }
        applicationId: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        connectionId: { type: string }
        productionConnectionUseAcknowledged: { type: boolean }
        createdByActorId: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    APIKey:
      type: object
      additionalProperties: false
      required: [id, environmentId, kind, prefix, createdByActorId, createdAt]
      properties:
        id: { type: string }
        environmentId: { type: string }
        kind: { $ref: "#/components/schemas/APIKeyKind" }
        prefix: { type: string }
        createdByActorId: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        rotatedAt: { $ref: "#/components/schemas/Timestamp" }
        revokedAt: { $ref: "#/components/schemas/Timestamp" }
        lastUsedAt: { $ref: "#/components/schemas/Timestamp" }
    APIKeySecretResult:
      type: object
      additionalProperties: false
      required: [apiKey, secret]
      properties:
        apiKey: { $ref: "#/components/schemas/APIKey" }
        secret:
          type: string
          description: Returned only by create and rotate operations and never available again.
          x-mosaic-one-time-secret: true
    Plan:
      type: object
      additionalProperties: false
      required: [id, projectId, key, name, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    ProductReadiness:
      type: object
      additionalProperties: false
      description: Legacy catalog lifecycle summary embedded in Product responses; never sufficient for publication.
      required: [ready, reasons, metadataSource]
      properties:
        ready: { type: boolean }
        reasons: { type: array, items: { type: string } }
        metadataSource: { $ref: "#/components/schemas/MetadataSource" }
    Product:
      type: object
      additionalProperties: false
      required: [id, projectId, key, internalName, type, status, metadataSource, readiness, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        key: { type: string }
        internalName: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/ProductType" }
        status: { $ref: "#/components/schemas/ProductStatus" }
        metadataSource: { $ref: "#/components/schemas/MetadataSource" }
        readiness: { $ref: "#/components/schemas/ProductReadiness" }
        replacementProductId: { type: string }
        archivedAt: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    Entitlement:
      type: object
      additionalProperties: false
      required: [id, projectId, key, name, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    PlanProduct:
      type: object
      additionalProperties: false
      required: [planId, productId, createdAt]
      properties:
        planId: { type: string }
        productId: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    ProductEntitlementGrant:
      type: object
      additionalProperties: false
      required: [productId, entitlementId, createdAt]
      properties:
        productId: { type: string }
        entitlementId: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    ProviderProductMapping:
      type: object
      additionalProperties: false
      required: [id, projectId, productId, applicationId, platform, provider, providerProductIdentifier, status, availability, syncState, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        productId: { type: string }
        connectionId: { type: string }
        environmentId: { type: string }
        applicationId: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        provider: { $ref: "#/components/schemas/ProviderKind" }
        providerProductIdentifier:
          type: string
          description: Opaque value emitted unchanged as Commerce Provider Contract providerProductReference.
        providerPackageIdentifier:
          type: string
          description: Optional RevenueCat Package metadata; present only with providerOfferingIdentifier.
        providerOfferingIdentifier:
          type: string
          description: Optional RevenueCat Offering metadata; present only with providerPackageIdentifier.
        expectedStoreProductId: { type: string }
        status: { $ref: "#/components/schemas/ProviderMappingStatus" }
        availability: { $ref: "#/components/schemas/ProviderAvailability" }
        syncState: { $ref: "#/components/schemas/ProviderSyncState" }
        currentSnapshotId: { type: string }
        lastErrorCode: { $ref: "#/components/schemas/ProviderErrorCode" }
        archivedAt: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    ProviderProductMetadataSnapshot:
      type: object
      additionalProperties: false
      description: Immutable safe metadata evidence; raw provider responses and credentials are excluded.
      required: [id, projectId, mappingId, source, digest, availability, observedAt, syncedAt, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        mappingId: { type: string }
        source: { type: string, enum: [provider, sdk_snapshot, manual] }
        digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        availability: { $ref: "#/components/schemas/ProviderAvailability" }
        observedAt: { $ref: "#/components/schemas/Timestamp" }
        syncedAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        lastErrorCode: { $ref: "#/components/schemas/ProviderErrorCode" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    ProviderReadinessIssue:
      type: object
      additionalProperties: false
      required: [code, resourceType, resourceId, recoveryAction]
      properties:
        code: { $ref: "#/components/schemas/ProviderErrorCode" }
        resourceType: { type: string }
        resourceId: { type: string }
        recoveryAction: { type: string }
    ProviderReadiness:
      type: object
      additionalProperties: false
      required: [state, productId, environmentId, applicationId, platform, blockers, warnings, evaluatedAt]
      properties:
        state: { type: string, enum: [draft, mockOnly, connected, attentionRequired, unavailable, archived] }
        productId: { type: string }
        environmentId: { type: string }
        applicationId: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        connectionId: { type: string }
        mappingId: { type: string }
        blockers: { type: array, items: { $ref: "#/components/schemas/ProviderReadinessIssue" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/ProviderReadinessIssue" } }
        evaluatedAt: { $ref: "#/components/schemas/Timestamp" }
    ProductUsage:
      type: object
      additionalProperties: false
      required: [productId, plans, entitlements, providerMappings, historicalReferences]
      properties:
        productId: { type: string }
        plans: { type: array, items: { $ref: "#/components/schemas/Plan" } }
        entitlements: { type: array, items: { $ref: "#/components/schemas/Entitlement" } }
        providerMappings: { type: array, items: { $ref: "#/components/schemas/ProviderProductMapping" } }
        historicalReferences: { type: array, items: { type: string } }
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorId, organizationId, action, resourceType, resourceId, metadata, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string }
        organizationId: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    ValidationSummary:
      type: object
      additionalProperties: false
      required: [errors, warnings]
      properties:
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    Paywall:
      type: object
      additionalProperties: false
      required: [id, projectId, key, name, status, createdByActorId, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        key: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, archived] }
        archivedAt: { $ref: "#/components/schemas/Timestamp" }
        createdByActorId: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    Draft:
      type: object
      additionalProperties: false
      required: [id, projectId, paywallId, environmentId, status, revision, protocolVersion, validationStatus, validation, createdByActorId, updatedByActorId, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        paywallId: { type: string }
        environmentId: { type: string }
        status: { type: string, enum: [active, published, archived] }
        revision: { type: integer, minimum: 1 }
        sourceVersionId: { type: string }
        protocolVersion: { type: string, const: "0.2" }
        validationStatus: { type: string, enum: [valid, invalid] }
        validation: { $ref: "#/components/schemas/ValidationSummary" }
        createdByActorId: { type: string }
        updatedByActorId: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    DraftResource:
      type: object
      additionalProperties: false
      required: [draft, document]
      properties:
        draft: { $ref: "#/components/schemas/Draft" }
        document: { type: object, additionalProperties: true }
    PaywallVersion:
      type: object
      additionalProperties: false
      required: [id, projectId, paywallId, environmentId, versionNumber, sourceDraftId, sourceRevision, protocolVersion, document, documentHash, validation, createdByActorId, createdAt, productIds]
      properties:
        id: { type: string }
        projectId: { type: string }
        paywallId: { type: string }
        environmentId: { type: string }
        versionNumber: { type: integer, minimum: 1 }
        sourceDraftId: { type: string }
        sourceRevision: { type: integer, minimum: 1 }
        protocolVersion: { type: string, const: "0.2" }
        document: { type: object, additionalProperties: true }
        documentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        validation: { $ref: "#/components/schemas/ValidationSummary" }
        createdByActorId: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        productIds: { type: array, items: { type: string } }
    Placement:
      type: object
      additionalProperties: false
