        "201": { $ref: "#/components/responses/Entitlement" }
        default: { $ref: "#/components/responses/Error" }
  /v1/entitlements/{entitlementId}:
    parameters:
      - $ref: "#/components/parameters/EntitlementID"
    get:
      operationId: getEntitlement
      tags: [Entitlements]
      responses:
        "200": { $ref: "#/components/responses/Entitlement" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateEntitlement
      tags: [Entitlements]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCatalogResourceRequest" }
      responses:
        "200": { $ref: "#/components/responses/Entitlement" }
        default: { $ref: "#/components/responses/Error" }
  /v1/products/{productId}/entitlements:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: listProductEntitlements
      tags: [Entitlements]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/EntitlementList" }
