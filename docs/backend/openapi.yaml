  /v1/sdk/configuration:
    get:
      operationId: getSDKConfiguration
      tags: [SDK Configuration]
      security: [{ PublicSDKKey: [] }]
      parameters:
        - { in: header, name: Mosaic-SDK-Platform, required: true, schema: { type: string, enum: [flutter, ios, android] } }
        - { in: header, name: Mosaic-SDK-Version, required: true, schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:[-+][A-Za-z0-9.-]+)?$" } }
        - { in: header, name: Mosaic-Configuration-Versions, required: true, schema: { type: string, pattern: "^(1|2|3)(, ?(1|2|3))*$" } }
        - { in: header, name: Mosaic-Paywall-Protocol-Versions, required: true, schema: { type: string, const: "0.2" } }
        - in: header
          name: Mosaic-Paywall-Capabilities
          required: true
          description: Comma-separated unique exact Protocol capability pairs (`name@0.2`), bounded to 128 pairs. The selected Release is returned only when every required pair is reported.
          schema: { type: string, minLength: 1, maxLength: 16384, example: "component.text@0.2,layout.stack@0.2" }
        - { in: header, name: Mosaic-Placement-Decision-Versions, required: false, schema: { type: string, pattern: "^1$" } }
        - { in: header, name: Mosaic-Decision-Features, required: false, description: Comma-separated exact Placement Decision v1 feature identifiers., schema: { type: string, maxLength: 16384 } }
        - { in: header, name: Mosaic-Bucketing-Algorithms, required: false, schema: { type: string, enum: [sha256_length_prefixed_v1] } }
        - { in: header, name: Mosaic-Experiment-Assignment-Versions, required: false, description: Required when Delivery v3 is requested. Comma-separated unique Experiment Assignment contract versions., schema: { type: string, maxLength: 16384, pattern: "^1$" } }
        - { in: header, name: Mosaic-Experiment-Features, required: false, description: Required when Delivery v3 is requested. Comma-separated unique exact Experiment Assignment v1 feature identifiers., schema: { type: string, minLength: 1, maxLength: 16384 } }
        - { in: header, name: Mosaic-Experiment-Bucketing-Algorithms, required: false, description: Required when Delivery v3 is requested. Comma-separated unique canonical Variant and Group bucketing algorithms., schema: { type: string, minLength: 1, maxLength: 16384 } }
        - { in: header, name: Mosaic-Experiment-Schedule-Policies, required: false, description: Required when Delivery v3 is requested. Comma-separated unique trusted-time schedule policies., schema: { type: string, minLength: 1, maxLength: 16384 } }
        - { in: header, name: Mosaic-App-Version, required: false, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { in: header, name: If-None-Match, required: false, schema: { type: string } }
      responses:
        "200":
          description: Highest mutually supported representation actually available for the current immutable Release. A v3-capable SDK falls back to an available v2 or safe v1 representation when that Release predates v3. Delivery v3 requires complete Experiment capability headers. A v1 candidate is withheld when an advanced Placement lacks an explicit Paywall default.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
            Vary: { schema: { type: string } }
          content:
            application/vnd.mosaic.configuration+json:
              schema: { type: object, additionalProperties: true }
        "304": { description: The current selected representation is unchanged. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "406": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sdk/commerce-configuration:
    get:
      operationId: getSDKCommerceConfiguration
      tags: [SDK Configuration]
      security: [{ PublicSDKKey: [] }]
      parameters:
        - { in: query, name: applicationId, required: true, schema: { type: string } }
        - { in: header, name: Accept, required: true, schema: { type: string, description: "Comma-separated accepted Commerce media types. Supported versions are application/vnd.mosaic.commerce-configuration+json;version=1 and version=2." } }
        - { in: header, name: Mosaic-SDK-Platform, required: true, schema: { type: string, enum: [flutter, ios, android] } }
        - { in: header, name: Mosaic-SDK-Version, required: true, schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:[-+][A-Za-z0-9.-]+)?$" } }
        - { in: header, name: Mosaic-Commerce-Configuration-Versions, required: true, schema: { type: string, pattern: "^(1|2)(, ?(1|2))*$" } }
        - { in: header, name: Mosaic-Commerce-Provider-Contract-Versions, required: true, schema: { type: string, pattern: "^(1|2)(, ?(1|2))*$" } }
        - { in: header, name: If-None-Match, required: false, schema: { type: string } }
      responses:
        "200":
          description: Immutable version-negotiated Commerce Configuration sidecar associated with the current Configuration Release and requested Application.
          headers:
            ETag: { schema: { type: string, pattern: '^"sha256:[0-9a-f]{64}"$' } }
            Mosaic-Configuration-Release-Id: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
            Vary: { schema: { type: string } }
          content:
            application/vnd.mosaic.commerce-configuration+json:
              schema: { type: object, additionalProperties: true }
        "304":
          description: The current immutable sidecar is unchanged.
          headers:
            ETag: { schema: { type: string } }
            Mosaic-Configuration-Release-Id: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
            Vary: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "406": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sdk/assets/{assetId}/{contentDigest}:
    parameters:
      - { $ref: "#/components/parameters/AssetID" }
      - in: path
        name: contentDigest
        required: true
        schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    get:
      security: []
      operationId: getAssetContent
      tags: [Assets]
      description: Public immutable Asset bytes. The URL contains no storage key or credential.
      responses:
        "200":
          description: Immutable Asset content.
          headers:
            Cache-Control: { schema: { type: string, const: "public, max-age=31536000, immutable" } }
            ETag: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/placement-attributes:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }]
    get:
      operationId: listPlacementAttributes
      tags: [Placement Decisions]
      responses: { "200": { description: Project attribute allow-list., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementAttributeListEnvelope" } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" } }
    post:
      operationId: createPlacementAttribute
      tags: [Placement Decisions]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePlacementAttributeRequest" } } } }
      responses: { "201": { description: Attribute definition created., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementAttributeEnvelope" } } } }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/placement-attributes/{attributeId}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { name: attributeId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: archivePlacementAttribute
      tags: [Placement Decisions]
      responses: { "204": { description: Attribute definition archived. }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/placements/{placementId}/usage:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/PlacementID" }]
    get:
      operationId: getPlacementUsage
      tags: [Placement Decisions]
      responses: { "200": { description: Placement usage., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementUsageEnvelope" } } } }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/placements/{placementId}/aliases:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/PlacementID" }]
    get:
      operationId: listPlacementAliases
      tags: [Placement Decisions]
      responses: { "200": { description: Placement aliases., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementAliasListEnvelope" } } } } }
    post:
      operationId: createPlacementAlias
      tags: [Placement Decisions]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" } } } } } }
      responses: { "201": { description: Alias created., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementAliasEnvelope" } } } }, "409": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/placements/{placementId}/archive:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/PlacementID" }]
    post:
      operationId: archivePlacementWithUsageCheck
      tags: [Placement Decisions]
      responses: { "204": { description: Placement archived. }, "409": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/rule-set:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/PlacementID" }]
    get:
      operationId: getPlacementDecision
      tags: [Placement Decisions]
      responses: { "200": { description: Combined Rule Set and current Draft detail., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementRuleSetDraftEnvelope" } } } }, "404": { $ref: "#/components/responses/Error" } }
    post:
      operationId: createPlacementRuleSet
      tags: [Placement Decisions]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementDecisionDocumentRequest" } } } }
      responses: { "201": { description: Rule Set and Draft created., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementRuleSetDraftEnvelope" } } } }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/rule-sets/{ruleSetId}/draft:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/PlacementID" }, { $ref: "#/components/parameters/RuleSetID" }]
    put:
      operationId: updatePlacementRuleSetDraft
      tags: [Placement Decisions]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementDecisionDocumentRequest" } } } }
      responses: { "200": { description: New immutable Draft revision., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementRuleSetDraftEnvelope" } } } }, "412": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" }, "428": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/rule-sets/{ruleSetId}/validate:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/PlacementID" }, { $ref: "#/components/parameters/RuleSetID" }]
    post:
      operationId: validatePlacementRuleSet
      tags: [Placement Decisions]
      responses: { "200": { description: Semantic validation result., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementValidationEnvelope" } } } } }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/rule-sets/{ruleSetId}/publish:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/PlacementID" }, { $ref: "#/components/parameters/RuleSetID" }]
    post:
      operationId: publishPlacementRuleSet
      tags: [Placement Decisions]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [expectedRevision], properties: { expectedRevision: { type: integer, minimum: 1 } } } } } }
      responses: { "201": { description: Immutable Rule Set Version., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementRuleSetVersionEnvelope" } } } }, "412": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/rule-sets/{ruleSetId}/archive:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/PlacementID" }, { $ref: "#/components/parameters/RuleSetID" }]
    post:
      operationId: archivePlacementRuleSet
      tags: [Placement Decisions]
      description: Archives the Rule Set and supersedes its active Draft while retaining immutable published versions. Only owners and admins may archive. Archived Rule Sets cannot be restored, edited, cloned, or published.
      responses: { "204": { description: Rule Set archived; immutable version history is retained. }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" }, "409": { description: Rule Set is already archived or conflicts with current state., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } } }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/rule-sets/{ruleSetId}/versions:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/PlacementID" }, { $ref: "#/components/parameters/RuleSetID" }]
    get:
      operationId: listPlacementRuleSetVersions
      tags: [Placement Decisions]
      responses: { "200": { description: Immutable version history., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementRuleSetVersionListEnvelope" } } } } }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/rule-sets/{ruleSetId}/versions/{versionId}/draft:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/PlacementID" }, { $ref: "#/components/parameters/RuleSetID" }, { name: versionId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: clonePlacementRuleSetVersion
      tags: [Placement Decisions]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "201": { description: Active Draft cloned from the immutable version., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementRuleSetDraftEnvelope" } } } }, "409": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/rule-sets/{ruleSetId}/simulate:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/PlacementID" }, { $ref: "#/components/parameters/RuleSetID" }]
    post:
      operationId: simulatePlacementDecision
      tags: [Placement Decisions]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementSimulationRequest" } } } }
      responses: { "200": { description: Ephemeral bounded decision trace; request inputs are neither logged nor persisted., content: { application/json: { schema: { $ref: "#/components/schemas/PlacementSimulationEnvelope" } } } }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/qa-overrides:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/PlacementID" }]
    get:
      operationId: listPlacementQAOverrides
      tags: [Placement Decisions]
      responses: { "200": { description: Active non-production QA overrides., content: { application/json: { schema: { $ref: "#/components/schemas/QAOverrideListEnvelope" } } } } }
    post:
      operationId: createPlacementQAOverride
      tags: [Placement Decisions]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateQAOverrideRequest" } } } }
      responses: { "201": { description: Override created; opaque token is returned once., content: { application/json: { schema: { $ref: "#/components/schemas/QAOverrideCreatedEnvelope" } } } }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/placements/{placementId}/qa-overrides/{overrideId}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/PlacementID" }, { name: overrideId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: revokePlacementQAOverride
      tags: [Placement Decisions]
      responses: { "204": { description: Override revoked; the next immutable release omits it. }, "404": { $ref: "#/components/responses/Error" } }

  /v1/projects/{projectId}/environments/{environmentId}/experiments:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
    get:
      operationId: listExperiments
      tags: [Experiments]
      responses: { "200": { description: Environment-scoped Experiments., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentListEnvelope" } } } } }
    post:
      operationId: createExperiment
      tags: [Experiments]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateExperimentRequest" } } } }
      responses: { "201": { description: Experiment and first Draft revision., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentEnvelope" } } } }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/metrics:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
    get: { operationId: listExperimentMetricDefinitions, tags: [Experiments], responses: { "200": { description: Immutable Experiment metric definitions., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentMetricListEnvelope" } } } } } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/groups:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
    get: { operationId: listExperimentGroups, tags: [Experiments], responses: { "200": { description: Mutual-exclusion groups., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentGroupListEnvelope" } } } } } }
    post:
      operationId: createExperimentGroupVersion
      tags: [Experiments]
      description: Creates a stable mutual-exclusion group and immutable first group Version. Later membership changes create another immutable Version.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateExperimentGroupRequest" } } } }
      responses: { "201": { description: Group and immutable Version., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentGroupCreatedEnvelope" } } } }, "404": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/groups/{groupId}/versions:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { name: groupId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: createExperimentMutualExclusionGroupVersion
      tags: [Experiments]
      description: Creates a new immutable Version; prior membership and allocation Versions remain unchanged and auditable.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateExperimentGroupVersionRequest" } } } }
      responses: { "201": { description: New immutable group Version., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentGroupVersionEnvelope" } } } }, "404": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
    get:
      operationId: listExperimentMutualExclusionGroupVersions
      tags: [Experiments]
      responses: { "200": { description: Immutable group Version history., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentGroupVersionListEnvelope" } } } }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }]
    get: { operationId: getExperiment, tags: [Experiments], responses: { "200": { description: Experiment root, current Draft, and active immutable Version., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentEnvelope" } } } }, "404": { $ref: "#/components/responses/Error" } } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/draft:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }]
    put:
      operationId: updateExperimentDraft
      tags: [Experiments]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateExperimentDraftRequest" } } } }
      responses: { "200": { description: New immutable Draft revision., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentDraftEnvelope" } } } }, "409": { description: Stale Draft revision with currentRevision and ETag recovery details., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }, "422": { $ref: "#/components/responses/Error" }, "428": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/validate:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }]
    post: { operationId: validateExperimentDraft, tags: [Experiments], responses: { "200": { description: Scientific, Product, provider, overlap, and compatibility validation., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentValidationEnvelope" } } } } } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/publish:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }]
    post:
      operationId: publishExperiment
      tags: [Experiments]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PublishExperimentRequest" } } } }
      responses: { "201": { description: Immutable Experiment Version and atomic Configuration Delivery v3 release., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentVersionEnvelope" } } } }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/versions:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }]
    get: { operationId: listExperimentVersions, tags: [Experiments], responses: { "200": { description: Immutable Experiment Version history., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentVersionListEnvelope" } } } } } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/history:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }]
    get: { operationId: listExperimentHistory, tags: [Experiments], responses: { "200": { description: Audited lifecycle and publication history., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentHistoryListEnvelope" } } } } } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/results:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }]
    get: { operationId: getExperimentResults, tags: [Experiments], responses: { "200": { description: Unique-unit conversion, Wilson/Newcombe uncertainty, freshness, warnings, and SRM. Never contains a Winner field., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentResultsEnvelope" } } } } } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/srm:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }]
    get: { operationId: getExperimentSampleRatioMismatch, tags: [Experiments], responses: { "200": { description: Descriptive Pearson chi-square SRM diagnostic., content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ExperimentSRM" } } } } } } } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/{lifecycleAction}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }, { name: lifecycleAction, in: path, required: true, schema: { type: string, enum: [schedule, start, pause, resume, stop, complete, archive, emergency-stop] } }]
    post:
      operationId: transitionExperimentLifecycle
      tags: [Experiments]
      description: Each accepted transition atomically appends history and publishes a new immutable release. Emergency stop always targets the normal Placement fallback.
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses: { "200": { description: Updated Experiment root., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentEnvelope" } } } }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/qa-overrides:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }]
    get: { operationId: listExperimentQAOverrides, tags: [Experiments], responses: { "200": { description: Safe QA override metadata without tokens., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentQAOverrideListEnvelope" } } } } } }
    post:
      operationId: createExperimentQAOverride
      tags: [Experiments]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateExperimentQAOverrideRequest" } } } }
      responses: { "201": { description: Non-production override; raw token returned once and never delivered as creator identity., content: { application/json: { schema: { $ref: "#/components/schemas/ExperimentQAOverrideCreatedEnvelope" } } } }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/qa-overrides/{overrideId}:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }, { name: overrideId, in: path, required: true, schema: { type: string } }]
    delete: { operationId: revokeExperimentQAOverride, tags: [Experiments], responses: { "204": { description: Override revoked. }, "404": { $ref: "#/components/responses/Error" } } }
  /v1/projects/{projectId}/environments/{environmentId}/experiments/{experimentId}/exports:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/ExperimentID" }]
    post:
      operationId: createExperimentRawExport
      tags: [Experiments]
      description: Owner/admin asynchronous raw Experiment export. Identity-bearing export is owner-only and expires after seven days.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateExperimentExportRequest" } } } }
      responses: { "202": { $ref: "#/components/responses/AnalyticsJob" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }

  /v1/sdk/events/batch:
    post:
      security: [{ PublicSDKKey: [] }]
      operationId: ingestAnalyticsEventBatch
      tags: [Analytics]
      description: The enclosing Analytics Event contract version must exactly match every eventSchemaVersion in the batch; mixed-version batches reject atomically.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsEventBatch" } } } }
      responses:
        "200": { description: Per-event ingestion outcomes., content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsIngestionResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/analytics/settings:
    parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
    get:
      operationId: getAnalyticsSettings
      tags: [Analytics]
      responses: { "200": { description: Analytics settings., content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsSettingsEnvelope" } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
    put:
      operationId: updateAnalyticsSettings
      tags: [Analytics]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateAnalyticsSettingsRequest" } } } }
      responses: { "200": { description: Updated analytics settings., content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsSettingsEnvelope" } } } }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [Analytics]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/AnalyticsFrom" }, { $ref: "#/components/parameters/AnalyticsTo" }, { $ref: "#/components/parameters/AnalyticsTimezone" }, { $ref: "#/components/parameters/AnalyticsMetricBasis" }, { $ref: "#/components/parameters/AnalyticsPlatform" }, { $ref: "#/components/parameters/AnalyticsLocale" }, { $ref: "#/components/parameters/AnalyticsApplicationVersion" }]
      responses: { "200": { $ref: "#/components/responses/AnalyticsResult" }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/analytics/funnels/{funnel}:
    get:
      operationId: getAnalyticsFunnel
      tags: [Analytics]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { name: funnel, in: path, required: true, schema: { type: string, enum: [placements, paywalls, products, purchases] } }, { $ref: "#/components/parameters/AnalyticsFrom" }, { $ref: "#/components/parameters/AnalyticsTo" }, { $ref: "#/components/parameters/AnalyticsTimezone" }, { $ref: "#/components/parameters/AnalyticsMetricBasis" }, { $ref: "#/components/parameters/AnalyticsPlatform" }, { $ref: "#/components/parameters/AnalyticsLocale" }, { $ref: "#/components/parameters/AnalyticsApplicationVersion" }]
      responses: { "200": { $ref: "#/components/responses/AnalyticsResult" }, "404": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/analytics/paywall-version-comparison:
    get: { operationId: compareAnalyticsPaywallVersions, tags: [Analytics], parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/AnalyticsFrom" }, { $ref: "#/components/parameters/AnalyticsTo" }, { $ref: "#/components/parameters/AnalyticsTimezone" }, { $ref: "#/components/parameters/AnalyticsMetricBasis" }, { $ref: "#/components/parameters/AnalyticsPlatform" }, { $ref: "#/components/parameters/AnalyticsLocale" }, { $ref: "#/components/parameters/AnalyticsApplicationVersion" }], responses: { "200": { $ref: "#/components/responses/AnalyticsResult" }, "422": { $ref: "#/components/responses/Error" } } }
  /v1/projects/{projectId}/environments/{environmentId}/analytics/provider-errors:
    get: { operationId: getAnalyticsProviderErrors, tags: [Analytics], parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/AnalyticsFrom" }, { $ref: "#/components/parameters/AnalyticsTo" }, { $ref: "#/components/parameters/AnalyticsTimezone" }, { $ref: "#/components/parameters/AnalyticsMetricBasis" }, { $ref: "#/components/parameters/AnalyticsPlatform" }, { $ref: "#/components/parameters/AnalyticsLocale" }, { $ref: "#/components/parameters/AnalyticsApplicationVersion" }], responses: { "200": { $ref: "#/components/responses/AnalyticsResult" }, "422": { $ref: "#/components/responses/Error" } } }
  /v1/projects/{projectId}/environments/{environmentId}/analytics/product-availability-failures:
    get: { operationId: getAnalyticsProductAvailabilityFailures, tags: [Analytics], parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/AnalyticsFrom" }, { $ref: "#/components/parameters/AnalyticsTo" }, { $ref: "#/components/parameters/AnalyticsTimezone" }, { $ref: "#/components/parameters/AnalyticsMetricBasis" }, { $ref: "#/components/parameters/AnalyticsPlatform" }, { $ref: "#/components/parameters/AnalyticsLocale" }, { $ref: "#/components/parameters/AnalyticsApplicationVersion" }], responses: { "200": { $ref: "#/components/responses/AnalyticsResult" }, "422": { $ref: "#/components/responses/Error" } } }
  /v1/projects/{projectId}/environments/{environmentId}/analytics/breakdowns/{dimension}:
    get:
      operationId: getAnalyticsBreakdown
      tags: [Analytics]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { name: dimension, in: path, required: true, schema: { type: string, enum: [platforms, locales] } }, { $ref: "#/components/parameters/AnalyticsFrom" }, { $ref: "#/components/parameters/AnalyticsTo" }, { $ref: "#/components/parameters/AnalyticsTimezone" }, { $ref: "#/components/parameters/AnalyticsMetricBasis" }, { $ref: "#/components/parameters/AnalyticsPlatform" }, { $ref: "#/components/parameters/AnalyticsLocale" }, { $ref: "#/components/parameters/AnalyticsApplicationVersion" }]
      responses: { "200": { $ref: "#/components/responses/AnalyticsResult" }, "404": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/analytics/freshness:
    get: { operationId: getAnalyticsFreshness, tags: [Analytics], parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/AnalyticsFrom" }, { $ref: "#/components/parameters/AnalyticsTo" }, { $ref: "#/components/parameters/AnalyticsTimezone" }, { $ref: "#/components/parameters/AnalyticsMetricBasis" }], responses: { "200": { $ref: "#/components/responses/AnalyticsResult" }, "422": { $ref: "#/components/responses/Error" } } }
  /v1/projects/{projectId}/environments/{environmentId}/analytics/exports:
    post:
      operationId: createAnalyticsEventExport
      tags: [Analytics]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateAnalyticsEventExportRequest" } } } }
      responses: { "202": { $ref: "#/components/responses/AnalyticsJob" }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/analytics/privacy/preview:
    post:
      operationId: previewAnalyticsPrivacyRequest
      description: Owner-only Project-scoped identity impact preview.
      tags: [Analytics Privacy]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsIdentityRequest" } } } }
      responses: { "200": { description: Privacy impact preview., content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsPrivacyPreviewEnvelope" } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/analytics/privacy/exports:
    post:
      operationId: createAnalyticsPrivacyExport
      description: Owner-only identity export creation.
      tags: [Analytics Privacy]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateAnalyticsPrivacyExportRequest" } } } }
      responses: { "202": { $ref: "#/components/responses/AnalyticsJob" }, "403": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/analytics/privacy/deletions:
    post:
      operationId: createAnalyticsPrivacyDeletion
      description: Owner-only confirmed identity deletion creation.
      tags: [Analytics Privacy]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateAnalyticsPrivacyDeletionRequest" } } } }
      responses: { "202": { $ref: "#/components/responses/AnalyticsJob" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/analytics/jobs/{jobId}:
    get:
      operationId: getAnalyticsJob
      description: Owners may inspect every analytics job. Admins may inspect event-export jobs only.
      tags: [Analytics Privacy]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { name: jobId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { $ref: "#/components/responses/AnalyticsJob" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/analytics/jobs/{jobId}/download:
    get:
      operationId: downloadAnalyticsJob
      description: Owners may download event and identity exports. Admins may download event exports only.
      tags: [Analytics Privacy]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { name: jobId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Private export artifact., content: { application/x-ndjson: { schema: { type: string, format: binary } }, text/csv: { schema: { type: string, format: binary } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: mosaic_session
      description: Opaque HttpOnly SameSite=Lax browser session. Cross-origin dashboard requests use credentials mode include.
    PublicSDKKey:
      type: http
      scheme: bearer
      bearerFormat: Mosaic public SDK key
  parameters:
    Cursor:
      in: query
      name: cursor
      description: Opaque cursor from the immediately preceding list response. Malformed or stale values return validation_failed.
      schema: { type: string }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    OrganizationID: { in: path, name: organizationId, required: true, schema: { type: string } }
    ActorID: { in: path, name: actorId, required: true, schema: { type: string } }
    ProjectID: { in: path, name: projectId, required: true, schema: { type: string } }
    EnvironmentID: { in: path, name: environmentId, required: true, schema: { type: string } }
    ApplicationID: { in: path, name: applicationId, required: true, schema: { type: string } }
    ProviderConnectionID: { in: path, name: connectionId, required: true, schema: { type: string } }
    ProviderMappingID: { in: path, name: mappingId, required: true, schema: { type: string } }
    APIKeyID: { in: path, name: apiKeyId, required: true, schema: { type: string } }
    PlanID: { in: path, name: planId, required: true, schema: { type: string } }
    ProductID: { in: path, name: productId, required: true, schema: { type: string } }
    EntitlementID: { in: path, name: entitlementId, required: true, schema: { type: string } }
    PaywallID: { in: path, name: paywallId, required: true, schema: { type: string } }
    DraftID: { in: path, name: draftId, required: true, schema: { type: string } }
    VersionID: { in: path, name: versionId, required: true, schema: { type: string } }
    PlacementID: { in: path, name: placementId, required: true, schema: { type: string } }
    RuleSetID: { in: path, name: ruleSetId, required: true, schema: { type: string } }
    ExperimentID: { in: path, name: experimentId, required: true, schema: { type: string } }
    AssetID: { in: path, name: assetId, required: true, schema: { type: string } }
    ReleaseID: { in: path, name: releaseId, required: true, schema: { type: string } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    IfMatch: { in: header, name: If-Match, required: true, schema: { type: string } }
    AnalyticsFrom: { in: query, name: from, required: true, schema: { $ref: "#/components/schemas/Timestamp" } }
    AnalyticsTo: { in: query, name: to, required: true, schema: { $ref: "#/components/schemas/Timestamp" } }
    AnalyticsTimezone: { in: query, name: timezone, required: true, schema: { type: string, example: UTC } }
    AnalyticsMetricBasis: { in: query, name: metricBasis, required: true, schema: { type: string, const: event_count } }
    AnalyticsPlatform: { in: query, name: platform, schema: { type: string, enum: [ios, android] } }
    AnalyticsLocale: { in: query, name: locale, schema: { type: string } }
    AnalyticsApplicationVersion: { in: query, name: applicationVersion, schema: { type: string } }
  responses:
    Error:
      description: Stable machine-readable failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    AnalyticsResult: { description: Event-count analytics result., content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsResultEnvelope" } } } }
    AnalyticsJob: { description: Asynchronous analytics job., content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsJobEnvelope" } } } }
    Organization: { description: Organization, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationEnvelope" } } } }
    OrganizationList: { description: Organizations, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationListEnvelope" } } } }
    Membership: { description: Membership, content: { application/json: { schema: { $ref: "#/components/schemas/MembershipEnvelope" } } } }
    MembershipList: { description: Memberships, content: { application/json: { schema: { $ref: "#/components/schemas/MembershipListEnvelope" } } } }
    Project: { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectEnvelope" } } } }
    ProjectList: { description: Projects, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectListEnvelope" } } } }
    Application: { description: Application, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationEnvelope" } } } }
    ApplicationList: { description: Applications, content: { application/json: { schema: { $ref: "#/components/schemas/ApplicationListEnvelope" } } } }
    Environment: { description: Environment, content: { application/json: { schema: { $ref: "#/components/schemas/EnvironmentEnvelope" } } } }
    EnvironmentList: { description: Environments, content: { application/json: { schema: { $ref: "#/components/schemas/EnvironmentListEnvelope" } } } }
    ProviderConnection: { description: Non-secret Provider Connection metadata, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderConnectionEnvelope" } } } }
    ProviderConnectionList: { description: Non-secret Provider Connections, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderConnectionListEnvelope" } } } }
    ProviderConnectionHealth:
      description: Safe connection health and capability summary.
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderConnectionHealth" } } }
    ProviderConnectionCapabilities:
      description: Closed provider capability matrix and required least-privilege permissions.
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderConnectionCapabilities" } } }
    ProviderDiagnostics:
      description: Safe provider diagnostics without provider response bodies or secrets.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ProviderDiagnostic" } }
    ProviderCatalogPreview:
      description: Normalized live provider catalog preview.
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderCatalogPreview" } } }
    ProviderImportResult:
      description: Idempotent selected-import result with item-level outcomes.
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderImportResult" } } }
    ProviderSyncJob:
      description: Accepted provider synchronization job.
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderSyncJob" } } }
    ProviderSyncRuns:
      description: Provider synchronization run history.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ProviderSyncRun" } }
    ProviderAssignment: { description: Active provider assignment, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderAssignmentEnvelope" } } } }
    ProviderReadiness: { description: Scoped provider readiness and stable recovery codes, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderReadinessEnvelope" } } } }
    ProviderMappingUsage: { description: Mapping-specific replacement impact, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderMappingUsageEnvelope" } } } }
    ProviderMappingObservation: { description: Accepted immutable native-store test observation, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderMappingObservationEnvelope" } } } }
    ProviderMappingObservations:
      description: Immutable native-store observation history.
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ProviderMappingObservation" } } } }
    ProviderProfile: { description: Credential-free native provider capability profile, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderProfileEnvelope" } } } }
    APIKey: { description: API key metadata, content: { application/json: { schema: { $ref: "#/components/schemas/APIKeyEnvelope" } } } }
    APIKeyList: { description: API keys without secrets, content: { application/json: { schema: { $ref: "#/components/schemas/APIKeyListEnvelope" } } } }
    APIKeySecret: { description: One-time secret result, content: { application/json: { schema: { $ref: "#/components/schemas/APIKeySecretEnvelope" } } } }
    Plan: { description: Plan, content: { application/json: { schema: { $ref: "#/components/schemas/PlanEnvelope" } } } }
    PlanList: { description: Plans, content: { application/json: { schema: { $ref: "#/components/schemas/PlanListEnvelope" } } } }
    PlanProduct: { description: Plan membership, content: { application/json: { schema: { $ref: "#/components/schemas/PlanProductEnvelope" } } } }
    Product: { description: Product, content: { application/json: { schema: { $ref: "#/components/schemas/ProductEnvelope" } } } }
    ProductList: { description: Products, content: { application/json: { schema: { $ref: "#/components/schemas/ProductListEnvelope" } } } }
    ProductUsage: { description: Product usage, content: { application/json: { schema: { $ref: "#/components/schemas/ProductUsageEnvelope" } } } }
    ProductReadiness: { description: Product readiness, content: { application/json: { schema: { $ref: "#/components/schemas/ProductReadinessEnvelope" } } } }
    ProviderMapping: { description: Placeholder mapping, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderMappingEnvelope" } } } }
    ProviderMappingList: { description: Placeholder mappings, content: { application/json: { schema: { $ref: "#/components/schemas/ProviderMappingListEnvelope" } } } }
    ProviderMetadataSnapshot:
      description: Current immutable normalized provider metadata and freshness evidence.
      content:
        application/json:
          schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderProductMetadataSnapshot" } } }
    Entitlement: { description: Entitlement definition, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementEnvelope" } } } }
    EntitlementList: { description: Entitlement definitions, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementListEnvelope" } } } }
    ProductEntitlementGrant: { description: Product grant, content: { application/json: { schema: { $ref: "#/components/schemas/ProductEntitlementGrantEnvelope" } } } }
    AuditEventList: { description: Audit events, content: { application/json: { schema: { $ref: "#/components/schemas/AuditEventListEnvelope" } } } }
    Paywall: { description: Paywall, content: { application/json: { schema: { $ref: "#/components/schemas/PaywallEnvelope" } } } }
    PaywallList: { description: Paywalls, content: { application/json: { schema: { $ref: "#/components/schemas/PaywallListEnvelope" } } } }
    Draft:
      description: Hosted Draft and current immutable revision document.
      headers: { ETag: { schema: { type: string } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/DraftEnvelope" } } }
    ValidationSummary: { description: Draft validation, content: { application/json: { schema: { $ref: "#/components/schemas/ValidationSummaryEnvelope" } } } }
    PaywallVersion: { description: Immutable Paywall Version, content: { application/json: { schema: { $ref: "#/components/schemas/PaywallVersionEnvelope" } } } }
    PaywallVersionList: { description: Immutable Paywall Versions, content: { application/json: { schema: { $ref: "#/components/schemas/PaywallVersionListEnvelope" } } } }
    Placement: { description: Placement, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementEnvelope" } } } }
    PlacementList: { description: Placements, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementListEnvelope" } } } }
    PlacementBinding: { description: Environment Placement binding, content: { application/json: { schema: { $ref: "#/components/schemas/PlacementBindingEnvelope" } } } }
    Asset: { description: Hosted Asset metadata, content: { application/json: { schema: { $ref: "#/components/schemas/AssetEnvelope" } } } }
    AssetList: { description: Hosted Assets, content: { application/json: { schema: { $ref: "#/components/schemas/AssetListEnvelope" } } } }
    AssetUsage: { description: Hosted Asset reference counts, content: { application/json: { schema: { $ref: "#/components/schemas/AssetUsageEnvelope" } } } }
    UserSession:
      description: Authenticated browser user. Login and signup also set the session cookie.
      content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
    Release: { description: Immutable Configuration Release metadata, content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseEnvelope" } } } }
    ReleaseList: { description: Configuration Release history, content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseListEnvelope" } } } }
    PublishResult: { description: Publication result and nonblocking warnings, content: { application/json: { schema: { $ref: "#/components/schemas/PublishResultEnvelope" } } } }
  schemas:
    CreateExperimentRequest:
      type: object
      additionalProperties: false
      required: [placementId, name]
      properties: { placementId: { type: string }, name: { type: string, minLength: 1, maxLength: 120 }, hypothesis: { type: string, maxLength: 1000 } }
    ExperimentSchedule:
      type: object
      additionalProperties: false
      required: [startsAt]
      properties: { startsAt: { $ref: "#/components/schemas/Timestamp" }, endsAt: { $ref: "#/components/schemas/Timestamp" } }
    ExperimentVariantDraft:
      type: object
      additionalProperties: false
      required: [role, name, paywallId, paywallVersionId, allocationBasisPoints]
      properties:
        id: { type: string }
        role: { type: string, enum: [control, treatment] }
        name: { type: string, minLength: 1, maxLength: 80 }
        paywallId: { type: string }
        paywallVersionId: { type: string }
        allocationBasisPoints: { type: integer, minimum: 1, maximum: 9999 }
    ExperimentDraftDocument:
      type: object
      additionalProperties: false
      required: [variants, assignmentKeyPolicy, primaryMetricVersionId, guardrailMetricVersionIds, schedule, qaPolicy]
      properties:
        variants: { type: array, minItems: 2, maxItems: 4, items: { $ref: "#/components/schemas/ExperimentVariantDraft" } }
        assignmentKeyPolicy: { type: string, enum: [installation, identified_user, identified_user_or_installation] }
        primaryMetricVersionId: { type: string, pattern: "^[a-z0-9_]+@[1-9][0-9]*$" }
