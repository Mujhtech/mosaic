  /v1/billing/apple/notifications/{intakeToken}:
    post:
      security: []
      operationId: receiveAppleStoreNotification
      tags: [Billing Ingestion]
      description: |
        App Store Server Notifications V2 intake. Authenticity comes from two independent
        factors: the unguessable per-credential intake token in the path (stored SHA-256 only)
        and JWS x5c-chain verification against the Apple Root CA compiled into the binary.
        Tenant identity always comes from the intake token, never from payload content.

        The endpoint never validates inline and never calls a store API on the request path:
        it verifies, persists the Raw Billing Input, enqueues validation, and returns 202.
        It is deliberately excluded from every 429-returning rate-limiter family, because a
        429 consumes one of Apple's five non-renewable retries and can lose a transaction
        permanently. An unknown bundle, a wrong Application, or an unsupported notification
        type is recorded and answered 202; only a durable-storage failure answers non-2xx.
      parameters:
        - { in: path, name: intakeToken, required: true, schema: { type: string }, description: One-time intake token issued with the credential. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signedPayload]
              properties:
                signedPayload: { type: string, description: Apple JWS notification payload. Never logged or echoed. }
      responses:
        "202": { description: The notification was durably recorded and queued for validation., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { status: { type: string, enum: [accepted] } } } } } } } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/sdk/billing/observations:
    post:
      security: [{ PublicSDKKey: [] }]
      operationId: submitTransactionObservation
      tags: [Billing Ingestion]
      description: |
        Untrusted client report of a purchase reference, submitted as the Billing Ingestion
        Contract v1 clientTransactionObservation record. A Transaction Observation is a trigger,
        never proof: the response cannot and does not claim validation, and the status set has no
        member meaning validated, verified, confirmed, or entitled.

        A client may not classify the Store Environment. The contract record carries no such
        member and is additionalProperties:false, so a client-asserted storeEnvironment is
        rejected with `unknown_field` rather than ignored — a device can be made to say anything,
        and accepting its classification would let a sandbox purchase present itself as
        production. Classification comes only from server-side validation of the store's own
        response.

        sourceAuthority must be `client_observation`, matching what a public SDK key actually
        proves; a higher claimed authority is refused with `authority_not_allowed`. The
        reference kind must align with storePlatform, so an Android digest can never be
        validated against Apple's API.

        Every outcome, including a rejection, is returned as the contract's
        observationSubmissionResult record so an SDK decodes one shape. This endpoint may return
        429; SDKs hold a durable queue and retry.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClientTransactionObservationRecord" } } } }
      responses:
        "202": { $ref: "#/components/responses/SubmissionAccepted" }
        "200": { $ref: "#/components/responses/SubmissionDuplicate" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/SubmissionRejected" }
        "429": { $ref: "#/components/responses/SubmissionRetryable" }
        "503": { $ref: "#/components/responses/SubmissionRetryable" }
  /v1/billing/server/observations:
    post:
      security: [{ ServerSecretKey: [] }]
      operationId: submitServerTransactionObservation
      tags: [Billing Ingestion]
      description: |
        Trusted app-backend observation, authenticated by a Mosaic secret server key. Unlike
        the public SDK endpoint it may classify the Store Environment and may carry a full
        Google purchase token, which is encrypted on receipt and never logged, because the
        caller is a server Mosaic issued a secret key to rather than a device.

        A trusted caller is more accountable, not more authoritative: the observation is still
        subject to complete provider validation. Responses use the same
        observationSubmissionResult record as the public endpoint.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServerTransactionObservationRecord" } } } }
      responses:
        "202": { $ref: "#/components/responses/SubmissionAccepted" }
        "200": { $ref: "#/components/responses/SubmissionDuplicate" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/SubmissionRejected" }
        "429": { $ref: "#/components/responses/SubmissionRetryable" }
        "503": { $ref: "#/components/responses/SubmissionRetryable" }
  /v1/sdk/billing/entitlements:
    get:
      security: [{ CustomerAccessToken: [] }]
      operationId: syncCustomerEntitlements
      tags: [Authoritative Entitlements]
      description: |
        The Access Decision Snapshot for the Billing Customer the Customer Access Token names,
        as the Authoritative Entitlement Contract v1 customerEntitlementSnapshot record.

        Two credentials are required and they answer different questions: the token decides
        WHICH customer is read, and the public SDK key in Mosaic-SDK-Key decides which
        Environment is asking. A public SDK key alone can never select a customer — it ships
        inside an application binary. A token presented with another Environment's key is 403.

        The response body is the contract's canonical serialization, byte for byte, because an
        SDK recomputes contentDigest over exactly the bytes it received.

        Freshness travels as headers as well as inside the record, so a 304 — which carries no
        body — still slides the caller's window. A confirmed-current snapshot therefore never
        expires merely because it was confirmed instead of resent. The combined horizon
        (validUntil minus issuedAt, plus staleGraceSeconds) never exceeds thirty days.

        A customer with no committed projection in this Environment is answered with a valid
        snapshot carrying no entries and projectionStatus.state `pending`. That is `unknown`,
        never `inactive`: absence of evidence is not evidence of absence.
      parameters:
        - { in: header, name: Mosaic-SDK-Key, required: true, schema: { type: string }, description: Public SDK key identifying the Environment and Application. }
        - { in: header, name: If-None-Match, required: false, schema: { type: string }, description: Strong entity tag from a previous response. Answered 304 only when the caller's snapshot version also matches. }
      responses:
        "200":
          description: The current Customer Entitlement Snapshot.
          headers:
            ETag: { schema: { type: string }, description: Opaque equality validator. It carries no ordering; snapshot monotonicity is decided by snapshotVersion alone. }
            Mosaic-Refresh-After: { schema: { type: string, format: date-time }, description: After this instant a reader should refresh. The snapshot stays fully valid. }
            Mosaic-Valid-Until: { schema: { type: string, format: date-time }, description: Hard end of authoritative validity. }
            Mosaic-Stale-Grace-Seconds: { schema: { type: integer }, description: Bounded window past validUntil in which previously active Entitlements may still be served, clearly marked stale. Zero is a strict policy. }
          content: { application/json: { schema: { $ref: "#/components/schemas/CustomerEntitlementSnapshotRecord" } } }
        "304":
          description: The cached snapshot is still current. No body; the freshness headers are refreshed.
          headers:
            ETag: { schema: { type: string } }
            Mosaic-Refresh-After: { schema: { type: string, format: date-time } }
            Mosaic-Valid-Until: { schema: { type: string, format: date-time } }
            Mosaic-Stale-Grace-Seconds: { schema: { type: integer } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    post:
      security: [{ CustomerAccessToken: [] }]
      operationId: syncCustomerEntitlementsWithNegotiation
      tags: [Authoritative Entitlements]
      description: |
        The conditional and negotiated form of the sync. The body is the contract's
        entitlementSyncRequest: supported contract versions, the snapshot version the caller
        already holds, its entity tag, and optionally the Entitlement keys to narrow to.

        billingCustomerId in the body is a hint only. The server derives the customer from the
        token and verifies the hint against it; a mismatch is refused rather than ignored,
        because silently ignoring it would let a client believe it had read a customer it had
        not. A caller can never widen access by asserting an identifier.

        Narrowing removes both entries and the sources no remaining entry references, so a
        narrowed snapshot never carries an orphan source.
      parameters:
        - { in: header, name: Mosaic-SDK-Key, required: true, schema: { type: string } }
        - { in: header, name: If-None-Match, required: false, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementSyncRequestRecord" } } } }
      responses:
        "200": { description: The current Customer Entitlement Snapshot., content: { application/json: { schema: { $ref: "#/components/schemas/CustomerEntitlementSnapshotRecord" } } } }
        "304": { description: The cached snapshot is still current. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "406": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/billing/server/customer-tokens:
    post:
      security: [{ ServerSecretKey: [] }]
      operationId: issueCustomerAccessToken
      tags: [Authoritative Entitlements]
      description: |
        Mint a Customer Access Token for a customer the calling backend has already
        authenticated. This is the second consumer of secret server key authentication.

        The request carries no Project and no Environment: tenant scope comes entirely from the
        authenticated key, so a compromised or careless caller cannot mint a token into a tenant
        it does not own.

        The token is opaque — 256 bits of randomness behind an mcat_ prefix, with no claims and
        no parseable structure. Mosaic stores only its SHA-256 digest, so the value in this
        response is the only time it exists outside the caller's process: it is never logged,
        never stored, and never returned again.

        requestedTtlSeconds is a request, not an instruction. The default is one hour and the
        contract maximum is twenty-four; a caller may shorten a token's life and can never
        lengthen it past the maximum, which the schema enforces independently.

        Only the sdk_sync audience is issued in Phase 9B. server_check is declared by the
        contract so adding it later costs no contract version, and is refused with
        validation_failed until the surface it names exists.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerAccessTokenIssuanceRequest" } } } }
      responses:
        "201": { description: The token and its metadata. The token value appears here and nowhere else., content: { application/json: { schema: { $ref: "#/components/schemas/CustomerAccessTokenIssuanceResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      security: [{ ServerSecretKey: [] }]
      operationId: listCustomerAccessTokens
      tags: [Authoritative Entitlements]
      description: |
        Token metadata for one Billing Customer. No token value is ever returned, because Mosaic
        does not have one to return — only digests are stored.
      parameters:
        - { in: query, name: billingCustomerId, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Token metadata., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/CustomerAccessTokenMetadata" } } } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/billing/server/customer-tokens/{tokenId}/revoke:
    post:
      security: [{ ServerSecretKey: [] }]
      operationId: revokeCustomerAccessToken
      tags: [Authoritative Entitlements]
      description: |
        Revoke a token immediately. Revocation is one row update — the practical advantage of an
        opaque credential over a signed one is that there is nothing to wait out — and takes
        effect on the next presentation regardless of remaining lifetime. The revocation is
        audited.

        A token belonging to another tenant matches no row and is reported as not found rather
        than forbidden, so a caller cannot probe for the existence of another tenant's tokens.
      parameters:
        - { in: path, name: tokenId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revocationReason]
              properties:
                revocationReason:
                  type: string
                  enum: [customer_signed_out, identity_changed, operator_revoked, customer_deleted, key_rotated, suspected_compromise, superseded_by_new_token]
      responses:
        "200": { description: The revoked token's metadata., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/CustomerAccessTokenMetadata" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/sdk/billing/restores:
    post:
      security: []
      operationId: submitSDKRestore
      tags: [Authoritative Entitlements]
      description: |
        Report a completed native restore and the observations it produced. The public SDK key
        proves which Environment is asking and nothing more: the request names no customer, and
        `billingCustomerId` is dropped unconditionally on this surface. Identity is resolved
        server-side from validated store lineage, never from anything a client asserts.

        The body carries **observation submission ids**, not provider transaction references. A
        Google purchase-token digest is computable by anyone holding the token, so accepting
        caller-supplied digests would let a caller attach someone else's input to its own
        restore.

        `202` and the body already carries the honest current answer, which is what a caller
        polls against. `restored` is never reported until an accepted snapshot reflects it.
      parameters:
        - { in: header, name: Mosaic-SDK-Key, required: true, schema: { type: string }, description: Public SDK key identifying the Environment and Application. It proves which Environment is asking and can never select a customer. }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RestoreRequestRecord" } } } }
      responses:
        "202": { description: The restore was recorded and the chain is running., content: { application/json: { schema: { $ref: "#/components/schemas/RestoreResultRecord" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sdk/billing/restores/{restoreId}:
    get:
      security: []
      operationId: getSDKRestore
      tags: [Authoritative Entitlements]
      description: |
        Poll one restore. The record carries two axes that are never merged: Mosaic's `outcome`
        and the native `providerOutcome`. A native restore that succeeded while Mosaic is still
        validating is `providerOutcome: completed` with `outcome: validation_pending`, which is
        the honest answer and the reason the two axes exist.

        Restore ids are 128-bit and server-minted. The read is Environment-scoped rather than
        customer-scoped, because a restore may have no customer yet.
      parameters:
        - { in: path, name: restoreId, required: true, schema: { type: string } }
        - { in: header, name: Mosaic-SDK-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: The restore record., content: { application/json: { schema: { $ref: "#/components/schemas/RestoreResultRecord" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/billing/server/restores:
    post:
      security: [{ ServerSecretKey: [] }]
      operationId: submitServerRestore
      tags: [Authoritative Entitlements]
      description: |
        The trusted equivalent of the SDK restore submission. This surface may name a
        `billingCustomerId`, because the caller is the application backend that already
        authenticated the user.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RestoreRequestRecord" } } } }
      responses:
        "202": { description: The restore was recorded and the chain is running., content: { application/json: { schema: { $ref: "#/components/schemas/RestoreResultRecord" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/billing/server/restores/{restoreId}:
    get:
      security: [{ ServerSecretKey: [] }]
      operationId: getServerRestore
      tags: [Authoritative Entitlements]
      parameters: [{ in: path, name: restoreId, required: true, schema: { type: string } }]
      responses:
        "200": { description: The restore record., content: { application/json: { schema: { $ref: "#/components/schemas/RestoreResultRecord" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/billing/identity/customers:
    post:
      security: [{ ServerSecretKey: [] }]
      operationId: identifyBillingCustomer
      tags: [Billing Identity]
      description: |
        Create-or-get the Billing Customer for one of your users. This is one of exactly two ways
        a Billing Customer comes into existence (plan section 5a); the other is a validated
        purchase fact that needs somewhere to attach. SDK initialization and installation
        registration create nothing, which is what keeps Mosaic clear of the duplicate-customer
        trap that client-anchored systems fall into.

        The body accepts exactly one field, so a caller cannot smuggle an installation
        identifier, a Project, or an Environment into the creation path: the tenant comes from
        the authenticated secret key. Answers 201 when a customer was created and 200 when an
        existing one was returned.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/IdentifyBillingCustomerRequest" } } } }
      responses:
        "200": { description: The existing Billing Customer., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingIdentityCustomer" } } } } } }
        "201": { description: A Billing Customer was created., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingIdentityCustomer" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/billing/identity/customers/{customerId}/aliases:
    get:
      security: [{ ServerSecretKey: [] }]
      operationId: listBillingCustomerAliases
      tags: [Billing Identity]
      description: |
        A customer's alias history. No response in this family carries an alias value or an alias
        digest: a digest is still a stable per-person identifier and nothing on a server surface
        needs one.
      parameters: [{ in: path, name: customerId, required: true, schema: { type: string } }]
      responses:
        "200": { description: Aliases., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/BillingCustomerAlias" } } } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      security: [{ ServerSecretKey: [] }]
      operationId: attachBillingCustomerAlias
      tags: [Billing Identity]
      description: |
        Attach an application-user alias to an existing customer. Login attaches; it never merges
        (plan section 5a rule 3). When the alias already resolves to a different customer the
        result is 409 `identity_conflict`: an identity conflict is opened, the named customer is
        frozen, and an operator resolves it. Neither candidate is granted anything automatically
        (OD-10).
      parameters: [{ in: path, name: customerId, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AttachBillingCustomerAliasRequest" } } } }
      responses:
        "201": { description: The attached alias., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingCustomerAlias" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/billing/identity/aliases/{aliasId}/revoke:
    post:
      security: [{ ServerSecretKey: [] }]
      operationId: revokeBillingCustomerAlias
      tags: [Billing Identity]
      description: |
        End-date an alias. The alias is the person-to-purchase link and therefore the erasable
        personal data in Mosaic Billing; the purchase evidence it pointed at is exempt and
        survives (see the privacy guide). Audited.
      parameters: [{ in: path, name: aliasId, required: true, schema: { type: string } }]
      responses:
        "204": { description: The alias was revoked. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/billing/identity/customers/{customerId}/sync-requests:
    post:
      security: [{ ServerSecretKey: [] }]
      operationId: requestBillingCustomerSync
      tags: [Billing Identity]
      description: |
        Schedule a projection for one customer. Deliberately not a read: the answer is "this has
        been queued", and a caller that needs the result reads the entitlement surfaces once the
        snapshot version moves. Triggers coalesce onto the customer scope, so a burst of requests
        produces one projection rather than a job storm.
      parameters: [{ in: path, name: customerId, required: true, schema: { type: string } }]
      responses:
        "202": { description: A projection was queued., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingSyncRequest" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/billing/identity/conflicts:
    get:
      security: [{ ServerSecretKey: [] }]
      operationId: listBillingIdentityConflicts
      tags: [Billing Identity]
      description: |
        Open identity conflicts awaiting operator resolution. A conflict freezes its disputed
        subject and grants neither candidate anything (OD-10). There is deliberately no automatic
        merge: automatic merge stays an ADR checkpoint, not something a heuristic reaches on its
        own.
      parameters: [{ in: query, name: status, schema: { type: string, enum: [open, resolved] } }]
      responses:
        "200": { description: Identity conflicts., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/BillingIdentityConflict" } } } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/billing/identity/conflicts/{conflictId}:
    get:
      security: [{ ServerSecretKey: [] }]
      operationId: getBillingIdentityConflict
      tags: [Billing Identity]
      description: |
        One conflict with the disputed Purchase Lineage, where the conflict is lineage-scoped.
        The disputed alias *type* is reported; the disputed alias digest is not rendered under
        any scope.
      parameters: [{ in: path, name: conflictId, required: true, schema: { type: string } }]
      responses:
        "200": { description: The conflict., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingIdentityConflictDetail" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/billing/server/customers/{customerId}:
    get:
      security: [{ ServerSecretKey: [] }]
      operationId: getBillingCustomer
      tags: [Authoritative Entitlements]
      description: |
        Read one Billing Customer directly. The response carries no alias values: aliases are
        stored as SHA-256 digests and the digest is never a read-side field.

        `identified` distinguishes a customer an application backend has named from one anchored
        only to a purchase — the distinction an operator needs first when a customer list looks
        larger than the user base.
      parameters:
        - { in: path, name: customerId, required: true, schema: { type: string } }
      responses:
        "200": { description: The Billing Customer., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingCustomer" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/billing/server/customers/{customerId}/entitlements:
    get:
      security: [{ ServerSecretKey: [] }]
      operationId: getCustomerEntitlementSnapshot
      tags: [Authoritative Entitlements]
      description: |
        The customer's current Customer Entitlement Snapshot, as the contract record. The read is
        audited: an operator credential reading a named customer's entitlement state is exactly
        the access a later investigation needs to be able to reconstruct.
      parameters:
        - { in: path, name: customerId, required: true, schema: { type: string } }
        - { in: query, name: environmentId, required: false, schema: { type: string }, description: Defaults to the Environment the secret key belongs to. Any other value is 403. }
      responses:
        "200": { description: The current snapshot., content: { application/json: { schema: { $ref: "#/components/schemas/CustomerEntitlementSnapshotRecord" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/billing/server/customers/{customerId}/entitlement-checks:
    post:
      security: [{ ServerSecretKey: [] }]
      operationId: checkCustomerEntitlements
      tags: [Authoritative Entitlements]
      description: |
        The focused multi-key access question, answered as the contract's entitlementCheckResult.

        The answer is never a bare boolean. Every requested key carries a state, a primary
        explanation, whether its end is known, and the contributing source count; the result
        carries the snapshot version, rule version, and asOf instant it was derived from. A
        caller that acts on the answer can say afterwards exactly which committed state it acted
        on, which a boolean makes impossible.

        This is the only surface on which `unavailable` is admissible for an Entitlement, and it
        means Mosaic could not answer — not that the customer lacks access. Billing being
        disabled for the Project is answered here with 200 and every key `unavailable`, rather
        than with an HTTP error, so a caller handles one shape.
      parameters:
        - { in: path, name: customerId, required: true, schema: { type: string } }
        - { in: query, name: environmentId, required: false, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementCheckRequestRecord" } } } }
      responses:
        "200": { description: The check result., content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementCheckResultRecord" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "406": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/billing/server/customers/{customerId}/subscriptions:
    get:
      security: [{ ServerSecretKey: [] }]
      operationId: listCustomerSubscriptions
      tags: [Authoritative Entitlements]
      description: |
        The customer's projected Subscription Instances with their current four-axis state.
        Keyset-paginated; the cursor is opaque and carries one value.
      parameters:
        - { in: path, name: customerId, required: true, schema: { type: string } }
        - { in: query, name: environmentId, required: false, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: Projected subscriptions., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/SubscriptionSummary" } }, nextCursor: { type: string } } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/billing/server/subscriptions/{instanceId}:
    get:
      security: [{ ServerSecretKey: [] }]
      operationId: getSubscriptionSnapshot
      tags: [Authoritative Entitlements]
      description: |
        One Subscription Instance's current projected state as the contract's
        subscriptionSnapshot record: four state axes, every provider-derived effective
        timestamp, and a checksum over the canonical serialization. No provider status string is
        admissible anywhere in the record.
      parameters:
        - { in: path, name: instanceId, required: true, schema: { type: string } }
      responses:
        "200": { description: The subscription snapshot., content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionSnapshotRecord" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/billing/server/subscriptions/{instanceId}/timeline:
    get:
      security: [{ ServerSecretKey: [] }]
      operationId: listSubscriptionTimeline
      tags: [Authoritative Entitlements]
      description: |
        The append-only explanation history for one Subscription Instance. Entries restate what a
        provider said and when it took effect; detail passes the same ledger safety guard as the
        9A ledger, so no provider payload fragment can appear here.
      parameters:
        - { in: path, name: instanceId, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: Timeline entries., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/SubscriptionTimelineEntry" } }, nextCursor: { type: string } } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/billing/settings:
    get:
      operationId: getBillingSettings
      tags: [Billing Operations]
      description: |
        Read a Project's Mosaic Billing configuration. Owner or admin only.

        This is the first-class enablement read. Inferring enablement from the billing health
        endpoint answers a different question, costs several aggregate queries, and cannot
        distinguish "billing is off" from "billing is on and nothing has happened yet".

        `canDisable` and `activeCredentialCount` report the credential rule ahead of time, so a
        caller can explain why disabling is unavailable instead of discovering it through a 409.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses:
        "200": { description: Billing settings., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingSettings" } } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateBillingSettings
      tags: [Billing Operations]
      description: |
        Enable or disable Mosaic Billing for a Project. Off by default. Owner or admin only.

        Disabling is refused with `409 store_credentials_still_active` while any Store Server
        Credential is active. Disabling with a credential in place would not stop ingestion: Apple
        keeps posting to an endpoint whose intake token still resolves, and every refusal spends
        one of five non-renewable delivery attempts. Revoking the credential is what actually stops
        the store, so the switch requires it first and then means exactly what it says.

        While disabled, notification intake, the RTDN pull consumer, and the validation,
        reconciliation, and replay workers all skip the Project as defense in depth.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [billingEnabled], properties: { billingEnabled: { type: boolean } } } } } }
      responses: { "200": { description: Updated settings., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { billingEnabled: { type: boolean } } } } } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/billing/store-credentials:
    get:
      operationId: listStoreServerCredentials
      tags: [Billing Credentials]
      description: Owner or admin only. Secret material is never returned, and neither is the notification endpoint URL.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      responses: { "200": { description: Store Server Credentials., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/StoreServerCredential" } } } } } } } } }, "403": { $ref: "#/components/responses/Error" } }
    post:
      operationId: createStoreServerCredential
      tags: [Billing Credentials]
      description: |
        Store a new Store Server Credential. The secret (an Apple .p8 In-App Purchase key or a
        Google service-account JSON key) is parsed and validated before it is persisted, then
        sealed under the Mosaic keyring. For Apple, the response carries the full notification
        endpoint URL exactly once; it embeds an intake token stored only as SHA-256 and is
        never returned by any read. Owner or admin only. Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateStoreServerCredentialRequest" } } } }
      responses: { "201": { $ref: "#/components/responses/StoreServerCredentialWithEndpoint" }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/billing/store-credentials/{credentialId}:
    get:
      operationId: getStoreServerCredential
      tags: [Billing Credentials]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/StoreCredentialID" }]
      responses: { "200": { $ref: "#/components/responses/StoreServerCredential" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/billing/store-credentials/{credentialId}/rotate:
    post:
      operationId: rotateStoreServerCredential
      tags: [Billing Credentials]
      description: |
        Replace the secret and mint a new intake token. The previous token stops resolving
        immediately, which is the point of rotating after a suspected compromise. The new
        endpoint URL is returned exactly once. Owner or admin only. Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/StoreCredentialID" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [secret], properties: { secret: { type: string, description: Write-only. Never returned. } } } } } }
      responses: { "200": { $ref: "#/components/responses/StoreServerCredentialWithEndpoint" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/billing/store-credentials/{credentialId}/revoke:
    post:
      operationId: revokeStoreServerCredential
      tags: [Billing Credentials]
      description: |
        Stop the credential being used and clear its intake token so the notification endpoint
        stops resolving. Nothing already recorded is removed: the ledger is the evidence trail
        a revocation is usually part of investigating. Owner or admin only. Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/StoreCredentialID" }]
      responses: { "200": { $ref: "#/components/responses/StoreServerCredential" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/billing/store-credentials/{credentialId}/test:
    post:
      operationId: testStoreServerCredential
      tags: [Billing Credentials]
      description: |
        Prove the stored secret still authenticates against the store without changing any
        store state. Apple is tested with a one-minute Get Notification History window; Google
        with a zero-consumption Pub/Sub pull. Owner or admin only. Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/StoreCredentialID" }]
      responses: { "200": { $ref: "#/components/responses/StoreServerCredential" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" }, "429": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/billing/facts:
    get:
      operationId: listTransactionFacts
      tags: [Billing Ledger]
      description: |
        Validated, provider-independent Transaction Facts. A fact is never a subscription, an
        entitlement, or an access grant, and carries no customer identity, price, or currency.
        Mosaic Environment and Store Environment are always two separate values.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/BillingCursor" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/BillingProviderFilter" }, { $ref: "#/components/parameters/BillingFrom" }, { $ref: "#/components/parameters/BillingTo" }]
      responses: { "200": { description: Transaction Facts., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/TransactionFact" } }, nextCursor: { type: string } } } } } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/billing/validation-attempts:
    get:
      operationId: listValidationAttempts
      tags: [Billing Ledger]
      description: Append-only history of every validation try. Earlier attempts are never overwritten and no provider response body is ever stored.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/BillingCursor" }, { $ref: "#/components/parameters/Limit" }, { in: query, name: status, schema: { type: string, enum: [validated, recorded_no_fact, quarantined, retryable_failure, permanently_failed] } }, { in: query, name: rawInputId, description: Narrow the list to one input's attempt history., schema: { type: string, maxLength: 128 } }]
      responses: { "200": { description: Validation Attempts., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ValidationAttempt" } }, nextCursor: { type: string } } } } } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/billing/ledger:
    get:
      operationId: listBillingLedger
      tags: [Billing Ledger]
      description: Append-only operational Billing Event Ledger. There is deliberately no update endpoint.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/BillingCursor" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/BillingFrom" }, { $ref: "#/components/parameters/BillingTo" }]
      responses: { "200": { description: Billing Ledger Entries., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/BillingLedgerEntry" } }, nextCursor: { type: string } } } } } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/billing/quarantine:
    get:
      operationId: listBillingQuarantine
      tags: [Billing Operations]
      description: Inputs and facts that cannot safely proceed.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }, { $ref: "#/components/parameters/BillingCursor" }, { $ref: "#/components/parameters/Limit" }, { in: query, name: status, schema: { type: string, enum: [open, retrying, closed_after_success, closed_superseded] } }, { in: query, name: reasonCode, schema: { type: string } }, { $ref: "#/components/parameters/BillingProviderFilter" }]
      responses: { "200": { description: Quarantine Records., content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/QuarantineRecord" } }, nextCursor: { type: string } } } } } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/billing/health:
    get:
      operationId: getBillingHealth
      tags: [Billing Operations]
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
      responses: { "200": { description: Billing health summary., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingHealth" } } } } } }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/billing/projection-health:
    get:
      operationId: getBillingProjectionHealth
      tags: [Billing Operations]
      description: |
        Phase 9B projection health. A sibling of billing health rather than a field on it: billing
        health answers whether Mosaic can still turn store notifications into facts, while this
        answers whether the authoritative answer Mosaic gives about a customer's access is still
        current. Every value is a count or a timestamp; nothing here can carry a customer value,
        an alias digest, a provider token, or a secret. Owner or admin only.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
      responses: { "200": { description: Projection health summary., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingProjectionHealth" } } } } } }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } }
  /v1/projects/{projectId}/environments/{environmentId}/billing/projection-replays:
    post:
      operationId: createBillingProjectionReplay
      tags: [Billing Operations]
      description: |
        Recompute committed entitlement state from the immutable facts and report what moved.
        Replay is the operational expression of principle 2: a projection is derived state, so a
        corrupt checkpoint, a promoted rule version, or a mapping repair is answered by
        recomputing rather than by patching what was derived. It reuses the ordinary projection
        command, so replayed state goes through the same lock, compare-and-swap, and atomic
        commit as live projection, and prior snapshots are never deleted.

        The request must be **bounded** — one subscription instance, one customer, or a fact
        window. There is deliberately no "replay everything" member: an unbounded replay is a
        migration, and bulk migration tooling is out of Phase 9B.

        `projectionRuleVersion` selects the semantics. A version this build does not derive under
        is refused with 422 rather than recomputed under the active engine and labelled with the
        requested number, because a checksum produced by the wrong engine is indistinguishable
        from a genuine determinism result.

        Provider asymmetry, stated rather than hidden: Apple replay is input-sourced, because a
        stored Apple payload re-validates to the same transaction. Google replay is fact-sourced,
        because Google validation re-queries live provider state and a re-query today does not
        reproduce what the provider said last month. Owner or admin only. Audited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateProjectionReplayRequest" } } } }
      responses:
        "200": { description: The replay ran., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ProjectionReplayResult" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/customers:
    get:
      operationId: listBillingCustomers
      tags: [Billing Customers]
      security: [{ BrowserSession: [] }]
      description: |
        The Environment's Billing Customers, newest first. Owner or admin only, enforced
        server-side: this is the most sensitive read surface Mosaic has, because it names who
        bought what.

        `identified` and `purchaseAnchored` are separate booleans rather than one state, because
        the interesting customers are the ones where they disagree — a purchase-anchored customer
        who never identified is real revenue with no person attached, and an identified customer
        with no purchase is a person with no revenue.

        The Environment filter admits a customer holding a pointer or a lineage here, and
        additionally a customer holding a lineage in no Environment at all: a customer created by
        a trusted identify and not yet party to any purchase belongs to the Project and to no
        Environment, and hiding it everywhere would make a just-created customer invisible.

        No alias value and no alias digest appears anywhere in the response.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/EnvironmentID" }
        - { in: query, name: status, schema: { type: string, enum: [active, frozen, anonymized] } }
        - { in: query, name: identified, description: Restrict to identified or to purchase-anchored-only customers., schema: { type: boolean } }
        - { in: query, name: conflictedOnly, description: Only customers party to an open identity conflict., schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Billing Customers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/BillingCustomerSummary" } }
                      nextCursor: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/customer-lookups:
    post:
      operationId: lookupBillingCustomer
      tags: [Billing Customers]
      security: [{ BrowserSession: [] }]
      description: |
        Read-only typed-identifier search. It resolves at most one Billing Customer and is
        structurally incapable of creating one: the read model behind it declares no writer at
        all. That distinction matters — the trusted identify endpoint is create-or-get, and using
        it as a search would mint one Billing Customer per mistyped support query.

        `application_user_id` resolves through the active alias resolution;
        `installation_id` resolves through association evidence, because an installation
        identifier is evidence and never an anchor and therefore has no alias resolution to read.
        The submitted value is digested server-side and is never stored, never logged, and never
        echoed — which is also why this is a POST with a body rather than a GET with a query
        string that would reach access logs, proxy logs, and browser history.

        A miss answers `200` with `found: false` rather than `404`: "no customer holds this
        identifier" is a true answer to a support question. Rate limited.
      parameters: [{ $ref: "#/components/parameters/ProjectID" }, { $ref: "#/components/parameters/EnvironmentID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingCustomerLookupRequest" }
      responses:
        "200": { description: The lookup result., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingCustomerLookupResult" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/customers/{customerId}:
    get:
      operationId: getOperatorBillingCustomer
      tags: [Billing Customers]
      security: [{ BrowserSession: [] }]
      description: |
        One Billing Customer with everything the customer page shows: lifecycle, the Environment's
        current snapshot version and as-of instant, aliases as protected representations, purchase
        lineages, subscriptions, one-time purchases, identity conflicts, the current entitlement
        entries with their sources, and projection status.

        It is one read rather than eight so the page describes one instant. `currentSnapshot` is
        absent — not empty — when the customer has never been projected in this Environment: "no
        answer yet" and "no entitlements" are different states and stay different.

        Aliases carry `aliasId`, `aliasType`, authority, and validity dates. There is no value
        field and no digest field: the alias id is the protected representation, and an alias
        digest is still a stable per-person identifier. Owner or admin only.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/EnvironmentID" }
        - { $ref: "#/components/parameters/BillingCustomerID" }
      responses:
        "200": { description: The Billing Customer., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingCustomerDetail" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/customers/{customerId}/entitlements:
    get:
      operationId: getBillingCustomerEntitlementSnapshot
      tags: [Billing Customers]
      security: [{ BrowserSession: [] }]
      description: |
        The customer's current committed Customer Entitlement Snapshot in this Environment, read
        through the same repository the trusted-server access API reads through — so the dashboard
        and an application backend see one answer derived once.

        `snapshotVersion` is the per-customer monotonic cache-monotonicity key. The snapshot
        checksum is deliberately not on this surface: it is a determinism control the replay
        surface compares, and an operator reading it can only mistake it for a state.
        Owner or admin only.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/EnvironmentID" }
        - { $ref: "#/components/parameters/BillingCustomerID" }
      responses:
        "200":
          description: The current snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      snapshot: { $ref: "#/components/schemas/BillingEntitlementSnapshot" }
                      projectionStatus: { $ref: "#/components/schemas/BillingProjectionStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/customers/{customerId}/subscriptions:
    get:
      operationId: listBillingCustomerSubscriptions
      tags: [Billing Customers]
      security: [{ BrowserSession: [] }]
      description: The customer's projected Subscription Instances in this Environment, keyset-paginated. Owner or admin only.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/EnvironmentID" }
        - { $ref: "#/components/parameters/BillingCustomerID" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/BillingSubscriptionSnapshot" } }
                      nextCursor: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/customers/{customerId}/sync-requests:
    post:
      operationId: createBillingCustomerSyncRequest
      tags: [Billing Customers]
      security: [{ BrowserSession: [] }]
      description: |
        Enqueue a recomputation of the customer's committed entitlement aggregate. It reaches the
        same enqueue the trusted-server surface does, so an operator's "sync now" and a backend's
        produce one job on one queue rather than two answers, and it computes nothing itself.

        It is deliberately not a restore: a restore needs a device to ask its store for purchases,
        which no operator can do on a customer's behalf, and a control claiming to would report a
        native outcome nobody produced. `202` — queued, not done. Rate limited. Audited.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/EnvironmentID" }
        - { $ref: "#/components/parameters/BillingCustomerID" }
      responses:
        "202": { description: The projection was queued., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/OperatorBillingSyncRequest" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/subscriptions/{instanceId}:
    get:
      operationId: getBillingSubscription
      tags: [Billing Customers]
      security: [{ BrowserSession: [] }]
      description: |
        One projected Subscription Instance. An instance belonging to another Environment is
        reported as absent rather than forbidden: a staging URL that happens to name a production
        instance must not confirm that the instance exists. Owner or admin only.
      parameters:
