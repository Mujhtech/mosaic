        projectId: { type: string }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
        archivedAt: { $ref: "#/components/schemas/Timestamp" }
        createdByActorId: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    PlacementBinding:
      type: object
      additionalProperties: false
      required: [projectId, environmentId, placementId, paywallId, updatedByActorId, updatedAt]
      properties:
        projectId: { type: string }
        environmentId: { type: string }
        placementId: { type: string }
        paywallId: { type: string }
        updatedByActorId: { type: string }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    Asset:
      type: object
      additionalProperties: false
      required: [id, projectId, kind, originalFilename, mediaType, byteLength, contentDigest, url, status, createdByActorId, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        kind: { type: string, enum: [image, video] }
        originalFilename: { type: string }
        mediaType: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif, video/mp4] }
        byteLength: { type: integer, minimum: 1 }
        contentDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        url: { type: string, format: uri, pattern: "^https://" }
        status: { type: string, enum: [pending, ready, failed, archived, deleted] }
        createdByActorId: { type: string }
        archivedAt: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    AssetUsage:
      type: object
      additionalProperties: false
      required: [draftReferences, versionReferences, releaseReferences]
      properties:
        draftReferences: { type: integer, minimum: 0 }
        versionReferences: { type: integer, minimum: 0 }
        releaseReferences: { type: integer, minimum: 0 }
    ConfigurationRelease:
      type: object
      additionalProperties: false
      required: [id, projectId, environmentId, releaseNumber, deliveryContractVersion, contentHash, publishedByActorId, publishedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        releaseNumber: { type: integer, minimum: 1 }
        deliveryContractVersion: { type: string, const: "1" }
        contentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        sourceReleaseId: { type: string }
        rollbackSourceReleaseId: { type: string }
        publishedByActorId: { type: string }
        publishedAt: { $ref: "#/components/schemas/Timestamp" }
    PublishResult:
      type: object
      additionalProperties: false
      required: [release, warnings]
      properties:
        release: { $ref: "#/components/schemas/ConfigurationRelease" }
        warnings: { type: array, items: { type: string } }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
            details: { type: object, additionalProperties: true }
            requestId: { type: string }
    # Shared by GET /health/live and GET /health/ready. `status` is "ok" from the
    # liveness probe and "ready" from the readiness probe. `version` is always
    # emitted by both; `commit` and `built` are omitted when the binary was not
    # stamped with build information.
    HealthEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, version]
          properties:
            status: { type: string, enum: [ok, ready] }
            version: { type: string }
            commit: { type: string }
            built: { type: string }
