    EntitlementReferenceRequest:
      type: object
      additionalProperties: false
      required: [entitlementId]
      properties:
        entitlementId: { type: string }
    CreateProviderMappingRequest:
      type: object
      additionalProperties: false
      required: [applicationId, provider, providerProductIdentifier]
      properties:
        applicationId: { type: string }
        provider: { $ref: "#/components/schemas/ProviderKind" }
        providerProductIdentifier: { type: string, minLength: 1, maxLength: 255 }
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, updatedAt]
      properties:
