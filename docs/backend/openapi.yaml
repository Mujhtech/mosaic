        - { $ref: "#/components/parameters/EnvironmentID" }
        - { $ref: "#/components/parameters/SubscriptionInstanceID" }
      responses:
        "200": { description: The Subscription Instance., content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BillingSubscriptionSnapshot" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments/{environmentId}/billing/subscriptions/{instanceId}/timeline:
    get:
      operationId: listBillingSubscriptionTimeline
      tags: [Billing Customers]
      security: [{ BrowserSession: [] }]
      description: |
        The append-only explanation history for one Subscription Instance, newest first. `detail`
        passes through the ledger guard function, which is what keeps a provider token or a raw
        payload fragment out of an explanation. Owner or admin only.
      parameters:
        - { $ref: "#/components/parameters/ProjectID" }
        - { $ref: "#/components/parameters/EnvironmentID" }
        - { $ref: "#/components/parameters/SubscriptionInstanceID" }
        - { $ref: "#/components/parameters/Limit" }
