  schemas:
    TransactionReference:
      type: object
      additionalProperties: false
      required: [referenceKind, value]
      description: |
        The provider reference a validation is performed against. Raw receipts, signed payloads,
        JWS representations, purchase tokens, and service-account material are structurally
        impossible to carry here: an Apple value is at most 24 decimal digits and a Google value
        is exactly 64 lowercase hexadecimal characters.
      properties:
        referenceKind: { type: string, enum: [app_store_transaction_id, google_play_token_digest] }
        value: { type: string, maxLength: 64 }
    ProviderOrderReference:
      type: object
      additionalProperties: false
      required: [referenceKind, value]
      description: "Optional Google Play order reference. A join handle only; never the identity of a Transaction Fact, because promotional purchases have none."
      properties:
        referenceKind: { type: string, const: google_play_order_id }
        value: { type: string, maxLength: 128 }
    ObservationContext:
      type: object
      additionalProperties: false
      required: [platform, sdkFamily, sdkVersion]
      description: "SDK context. It carries no Organization, Project, Environment, or Application identity: tenant scope is derived from the authenticated key."
      properties:
        platform: { type: string, enum: [ios, android] }
        sdkFamily: { type: string, enum: [flutter, ios, android] }
        sdkVersion: { type: string, maxLength: 64 }
        operatingSystemVersion: { type: string, maxLength: 64 }
        applicationVersion: { type: string, maxLength: 64 }
    ObservationCorrelation:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Correlation to Analytics Event 1/2 through the existing opaque handles only.
      properties:
        purchaseAttemptId: { type: string, maxLength: 128 }
        providerOperationId: { type: string, maxLength: 128 }
        providerUpdateId: { type: string, maxLength: 128 }
    StoreEnvironmentClassification:
      type: object
      additionalProperties: false
      required: [classification, basis]
      description: "Server-derived Store Environment classification. A client never asserts it: no observation submitted by a client carries this property at all."
      properties:
        classification: { type: string, enum: [sandbox, production, unclassified] }
        basis: { type: string, enum: [provider_asserted, provider_endpoint, signature_environment, mosaic_environment_policy, unknown] }
    ClientTransactionObservationRecord:
      type: object
      additionalProperties: false
      required: [billingIngestionContractVersion, recordType, payload]
      description: |
        The Billing Ingestion Contract v1 clientTransactionObservation record, accepted verbatim
        so one platform-neutral document travels from four SDKs to one server.
      properties:
        billingIngestionContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: clientTransactionObservation }
        payload: { $ref: "#/components/schemas/ClientTransactionObservation" }
    ClientTransactionObservation:
      type: object
      additionalProperties: false
      required: [observationId, submissionId, providerId, storePlatform, transactionReference, observedAt, sourceAuthority, context]
      description: |
        An untrusted claim that a transaction may exist. It carries no receipt, no signed
        payload, no purchase token, no credential, no price, no entitlement assertion, no tenant
        identity, and no Store Environment assertion.

        There is deliberately no storeEnvironmentClassification member, and additionalProperties
        is false, so a client-asserted Store Environment is rejected with `unknown_field` rather
        than ignored. Classification comes only from server-side validation.

        sourceAuthority must be `client_observation`: a public SDK key proves only that a client
        sent the document, and any higher authority claimed here is refused with
        `authority_not_allowed`.
      properties:
        observationId: { type: string, maxLength: 128 }
        submissionId: { type: string, maxLength: 128, description: "Deterministic idempotency key computed by the SDK. Never derived from a timestamp, price, Product, or subject." }
        providerId: { type: string, maxLength: 128 }
        storePlatform: { type: string, enum: [apple_app_store, google_play] }
        transactionReference: { $ref: "#/components/schemas/TransactionReference" }
        providerOrderReference: { $ref: "#/components/schemas/ProviderOrderReference" }
        observedAt: { type: string, description: "UTC timestamp, RFC 3339 with a literal Z." }
        sourceAuthority: { type: string, const: client_observation }
        context: { $ref: "#/components/schemas/ObservationContext" }
        correlation: { $ref: "#/components/schemas/ObservationCorrelation" }
        claimedMosaicProductId: { type: string, maxLength: 128, description: "A claim only. The server resolves the Mosaic Product independently; a mismatch is a diagnostic and never an override." }
    ServerTransactionObservationRecord:
      type: object
      additionalProperties: false
      required: [billingIngestionContractVersion, recordType, payload]
      properties:
        billingIngestionContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: serverTransactionObservation }
        payload: { $ref: "#/components/schemas/ServerTransactionObservation" }
    ServerTransactionObservation:
      type: object
      additionalProperties: false
      required: [observationId, submissionId, providerId, storePlatform, transactionReference, sourceAuthority, trustBasis, receivedAt]
      description: |
        A trusted app-backend observation. It records how trust was established, never the
        credential that established it. Like the client record it carries no purchase token: the
        reference is the same digest a client would send.

        On this endpoint sourceAuthority must be `trusted_server_observation`. A Mosaic secret
        server key proves a trusted backend sent the document; it proves nothing about a provider
        having signed anything, so `provider_notification`, `reconciliation_discovery`, and
        `manual_revalidation` — authorities only Mosaic's own pipeline may author — are refused
        with `authority_not_allowed`.
      properties:
        observationId: { type: string, maxLength: 128 }
        submissionId: { type: string, maxLength: 128 }
        providerId: { type: string, maxLength: 128 }
        storePlatform: { type: string, enum: [apple_app_store, google_play] }
        transactionReference: { $ref: "#/components/schemas/TransactionReference" }
        providerOrderReference: { $ref: "#/components/schemas/ProviderOrderReference" }
        sourceAuthority: { type: string, const: trusted_server_observation }
        trustBasis: { type: string, enum: [provider_signature_verified, mutual_tls, provider_server_api, operator_initiated] }
        purchaseToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            The full Google Play purchase token, permitted only here, only on a `google_play`
            record, and only under `trusted_server_observation` authority. The client record has
            no such member and rejects one as `unknown_field`.

            It is a transaction reference the buyer's own purchase produced, not a Mosaic provider
            credential; service-account keys, signing keys, and Authorization values remain
            forbidden everywhere. It is encrypted at rest on receipt, never logged, never returned
            on any read, and never relieves the record of full provider validation.

            When present it MUST SHA-256-digest to this record's own `transactionReference.value`.
            Without that binding a caller could file a real token under a different transaction's
            reference, and Mosaic would validate the token, get a genuine answer from Google, and
            record it as a fact about the transaction the reference named. A mismatch is rejected
            with `provider_reference_malformed`.

            It exists because a digest cannot be reversed: without a token a Google observation
            has nothing to validate against and can only wait for the notification.
        receivedAt: { type: string }
        providerReportedAt: { type: string }
        providerNotificationReference: { type: string, maxLength: 128, description: Opaque provider notification identifier. Never the notification body. }
        storeEnvironmentClassification: { $ref: "#/components/schemas/StoreEnvironmentClassification" }
        correlation: { $ref: "#/components/schemas/ObservationCorrelation" }
        originatingObservationId: { type: string, maxLength: 128, description: Referencing a client observation never raises that observation's authority. }
    ObservationSubmissionResultRecord:
      type: object
      additionalProperties: false
      required: [billingIngestionContractVersion, recordType, payload]
      description: |
        The Billing Ingestion Contract v1 observationSubmissionResult record, returned verbatim
        by both observation endpoints so every SDK decodes one platform-neutral shape. Validated
        against protocol/schema/billing-ingestion/v1/submission-response.schema.json.
      properties:
        billingIngestionContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: observationSubmissionResult }
        payload: { $ref: "#/components/schemas/ObservationSubmissionResult" }
    ObservationSubmissionResult:
      type: object
      additionalProperties: false
      required: [submissionId, receivedAt, status]
      description: |
        The status set contains no member named validated, verified, confirmed, or entitled.
        Acceptance means the observation is well formed and queued and asserts nothing about the
        transaction being real. A reader must never grant access, unlock content, or emit a
        provider-confirmed Analytics Event on accepted_for_validation.
      properties:
        submissionId: { type: string, maxLength: 128 }
        receivedAt: { type: string, description: "UTC timestamp, RFC 3339 with a literal Z and at most microsecond precision." }
        status: { type: string, enum: [accepted_for_validation, duplicate, permanently_rejected, retryable_failure] }
        code:
          type: string
          description: Required for permanently_rejected and retryable_failure, absent otherwise.
          enum: [observation_schema_invalid, unsupported_contract_version, unsupported_record_type, unknown_field, invalid_identifier, invalid_timestamp, observed_at_too_far_future, observation_expired, observation_too_large, provider_reference_malformed, provider_reference_too_long, reference_kind_not_supported_for_platform, credential_shaped_value_rejected, sensitive_value_rejected, tenant_field_forbidden, authority_not_allowed, unknown_provider, billing_not_enabled_for_environment, observation_id_conflict, rate_limited, storage_temporarily_unavailable, service_temporarily_unavailable, ingestion_timeout, validation_backlog_saturated]
        retryAfterSeconds: { type: integer, minimum: 1, maximum: 86400, description: Advisory hint on retryable_failure only. }
        estimatedValidationDelaySeconds: { type: integer, minimum: 1, maximum: 86400, description: "Advisory hint on accepted_for_validation only. Says when validation is likely to run, never that it succeeded." }
    StoreServerCredentialApplication:
      type: object
      properties:
        applicationId: { type: string }
        platform: { type: string, enum: [ios, android] }
        providerApplicationIdentifier: { type: string, description: Apple bundle id or Google package name. The verified payload must match one of these. }
    StoreServerCredential:
      type: object
      description: Encrypted Apple or Google server credential. Secret material is never returned.
      properties:
        id: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        provider: { type: string, enum: [app_store, google_play] }
        storeEnvironment: { type: string, enum: [sandbox, production], description: Store Environment, always distinct from the Mosaic Environment. }
        name: { type: string }
        status: { type: string, enum: [active, revoked] }
        healthStatus: { type: string, enum: [untested, healthy, degraded, unavailable, revoked] }
        appleIssuerId: { type: string }
        appleKeyId: { type: string }
        googleClientEmail: { type: string }
        googlePubSubProjectId: { type: string }
        googlePubSubSubscriptionId: { type: string }
        applications: { type: array, items: { $ref: "#/components/schemas/StoreServerCredentialApplication" } }
        lastErrorCode: { type: string }
        lastTestedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        rotatedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StoreServerCredentialWithEndpoint:
      allOf:
        - $ref: "#/components/schemas/StoreServerCredential"
        - type: object
          properties:
            notificationEndpointUrl:
              type: string
              description: |
                Full Apple notification endpoint including the intake token. Returned only on
                create and rotate. The token is stored as SHA-256 only and cannot be recovered.
    CreateStoreServerCredentialRequest:
      type: object
      additionalProperties: false
      required: [environmentId, provider, storeEnvironment, name, secret, applications]
      properties:
        environmentId: { type: string }
        provider: { type: string, enum: [app_store, google_play] }
        storeEnvironment: { type: string, enum: [sandbox, production], description: Must align with the Environment mode; sandbox and production never mix. }
        name: { type: string, maxLength: 120 }
        secret: { type: string, description: "Write-only. Apple .p8 PEM or Google service-account JSON. Validated before persistence, never returned." }
        appleIssuerId: { type: string }
        appleKeyId: { type: string }
        googleClientEmail: { type: string }
        googlePubSubProjectId: { type: string }
        googlePubSubSubscriptionId: { type: string }
        applications: { type: array, minItems: 1, maxItems: 32, items: { $ref: "#/components/schemas/StoreServerCredentialApplication" } }
    TransactionFact:
      type: object
      description: |
        A normalized, provider-independent statement that a store confirmed something
        happened. Never a subscription, an entitlement, or an access grant. Carries no
        customer identity, price, or currency.
      properties:
        id: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        applicationId: { type: string }
        provider: { type: string, enum: [app_store, google_play] }
        storeEnvironment: { type: string, enum: [sandbox, production] }
        providerTransactionId: { type: string }
        providerOriginalTransactionId: { type: string }
        transactionType: { type: string, enum: [auto_renewable_subscription, non_consumable] }
        factKind: { type: string, enum: [initial_purchase, renewal, one_time_purchase, plan_change, offer_redeemed, refund, revocation, expiration, grace_period_start, billing_retry_start, cancellation_scheduled, auto_renew_disabled, auto_renew_enabled, purchase_superseded, paused, resumed] }
        occurredAt: { type: string, format: date-time }
        periodStartAt: { type: string, format: date-time, description: "Provider-stated validity only. Never interpreted as customer access." }
        periodEndAt: { type: string, format: date-time, description: "Provider-stated validity only. Never interpreted as customer access." }
        revokedAt: { type: string, format: date-time }
        refundedAt: { type: string, format: date-time }
        renewalExpected: { type: boolean }
        isTestTransaction: { type: boolean }
        providerProductIdentifier: { type: string }
        providerBasePlanIdentifier: { type: string }
        providerOfferIdentifier: { type: string }
        resolutionState: { type: string, enum: [active_mapping, archived_mapping, replacement_chain, unresolved] }
        mosaicProductId: { type: string }
        providerProductMappingId: { type: string }
        resolvedMappingVersion: { type: integer, format: int64, description: Resolution Snapshot version, so historical resolution is reproducible. }
        validatorVersion: { type: integer }
        factVersion: { type: integer }
        sourceRawInputId: { type: string }
        validationAttemptId: { type: string }
        recordedAt: { type: string, format: date-time }
    ValidationAttempt:
      type: object
      description: One append-only record of one validation try. No provider response body is ever stored.
      properties:
        id: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        rawInputId: { type: string }
        credentialId: { type: string }
        attemptNumber: { type: integer }
        validatorVersion: { type: integer }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        outcome: { type: string, enum: [validated, recorded_no_fact, quarantined, retryable_failure, permanently_failed] }
        retryable: { type: boolean }
        failureCategory: { type: string, enum: [transient, rate_limited, auth, quota, not_found_retryable, not_found_terminal, invalid, signature, resolution, configuration] }
        diagnosticCode: { type: string, description: Mosaic-owned stable code. }
        providerCode: { type: string, description: Provider machine code, bounded to a safe charset. }
        providerHttpStatus: { type: integer }
        storeEnvironment: { type: string, enum: [sandbox, production, unclassified] }
        latencyMs: { type: integer }
        replayOfAttemptId: { type: string }
        correlationId: { type: string }
    BillingLedgerEntry:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        entryType: { type: string, enum: [input_received, input_authenticated, input_duplicate_detected, validation_started, validation_succeeded, validation_failed, product_resolved, product_resolution_failed, fact_recorded, fact_deduplicated, input_quarantined, quarantine_closed, reconciliation_started, reconciliation_discovery, reconciliation_completed, replay_started, replay_completed, revalidation_completed, credential_health_changed] }
        rawInputId: { type: string }
        validationAttemptId: { type: string }
        transactionFactId: { type: string }
        credentialId: { type: string }
        correlationId: { type: string }
        occurredAt: { type: string, format: date-time }
    QuarantineRecord:
      type: object
      description: |
        An input that cannot safely proceed. The only status that follows a successful
        revalidation is closed_after_success, and it always names the attempt that justified
        it. There is no status, field, or action meaning an operator declared the input valid.
      properties:
        id: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        rawInputId: { type: string }
        applicationId: { type: string }
        provider: { type: string, enum: [app_store, google_play] }
        storeEnvironment:
          type: string
          enum: [sandbox, production, unclassified]
          description: |
            Store Environment of the quarantined input, always distinct from the Mosaic
            Environment. Never absent: an input whose environment was not classified before it
            quarantined reports `unclassified` explicitly, because a missing value on an operator
            surface reads as production to a careless eye.
        providerProductIdentifier:
          type: string
          description: |
            The store Product the quarantined input named, carried from the input's most recent
            resolution attempt. For the common `product_unknown` case it is the single most
            actionable field on the record: it is exactly what the operator has to create a mapping
            for.
        reasonCode: { type: string, enum: [signature_invalid, application_mismatch, environment_mismatch, store_environment_mismatch, credential_unavailable, credential_revoked, missing_validation_credential, product_unknown, product_ambiguous, cross_environment_mismatch, unsupported_product_type, unsupported_transaction_type, malformed_reference, input_content_conflict, replay_conflict, provider_permanently_failed, validation_exhausted] }
        severity: { type: string, enum: [warning, error, security] }
        scopes: { type: array, items: { type: string } }
        status: { type: string, enum: [open, retrying, closed_after_success, closed_superseded] }
        attemptCount: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        lastAttemptAt: { type: string, format: date-time }
        closingAttemptId: { type: string, description: The successful attempt that justified closure. }
        supersededByRecordId: { type: string }
        closedAt: { type: string, format: date-time }
        diagnosticCode: { type: string }
    ReconciliationRun:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        credentialId: { type: string }
        provider: { type: string, enum: [app_store, google_play] }
        trigger: { type: string, enum: [scheduled, manual] }
        strategy: { type: string, enum: [apple_notification_history, apple_transaction_history, google_token_requery] }
        status: { type: string, enum: [queued, leased, completed, partial, failed] }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        examinedCount: { type: integer, format: int64 }
        discoveredCount: { type: integer, format: int64 }
        duplicateCount: { type: integer, format: int64 }
        conflictCount:
          type: integer
          format: int64
          description: |
            Discoveries that contradicted a fact already on record, as distinct from discoveries
            that were merely new. Gate 9A requires reconciliation to detect missing *or*
            conflicting state; without a separate counter the two are indistinguishable. Nothing is
            overwritten — both facts stand — and each conflict also opens a quarantine record.
        failureCount: { type: integer, format: int64 }
        lastErrorCode: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    CreateReconciliationRunRequest:
      type: object
      additionalProperties: false
      required: [credentialId, provider, strategy, windowStart, windowEnd]
      properties:
        credentialId: { type: string }
        provider: { type: string, enum: [app_store, google_play] }
        strategy:
          type: string
          enum: [apple_notification_history, google_token_requery]
          description: |
            apple_transaction_history is deliberately absent: the worker has no run loop for it, so
            accepting it produced a 202 followed by a run that failed with `unsupported_strategy`
            and no explanation anywhere in the product. It remains in the stored enumeration for
            forward compatibility and is rejected at the API boundary until the loop exists.
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time, description: The window may not exceed 180 days, which is Apple's own notification-history retention. }
    ReplayJob:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        kind: { type: string, enum: [replay, revalidation] }
        rawInputId: { type: string }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        validatorVersion: { type: integer }
        status: { type: string, enum: [queued, leased, completed, failed] }
        comparisonResult: { type: string, enum: [identical, new_facts, conflicting, still_failing] }
        examinedCount: { type: integer, format: int64 }
        unchangedCount: { type: integer, format: int64 }
        newFactCount: { type: integer, format: int64 }
        conflictCount: { type: integer, format: int64 }
        lastErrorCode: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    CreateReplayJobRequest:
      type: object
      additionalProperties: false
      required: [kind]
      description: Supply either a single rawInputId or a bounded window, never both.
      properties:
        kind: { type: string, enum: [replay, revalidation] }
        rawInputId: { type: string }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        validatorVersion: { type: integer, minimum: 1 }
    CustomerAccessTokenIssuanceRequest:
      type: object
      additionalProperties: false
      required: [customerAccessTokenContractVersion, recordType, payload]
      properties:
        customerAccessTokenContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: customerAccessTokenIssuanceRequest }
        payload:
          type: object
          additionalProperties: false
          required: [billingCustomerId, audience, scopes, correlationId]
          properties:
            billingCustomerId: { type: string, minLength: 1, maxLength: 128 }
            audience: { type: string, enum: [sdk_sync, server_check], description: "Only sdk_sync is issued in Phase 9B." }
            scopes: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { type: string, enum: [entitlements.read, entitlements.sync, restore.request] } }
            requestedTtlSeconds: { type: integer, minimum: 60, maximum: 86400, description: "A request, not an instruction. Clamped to the contract maximum." }
            correlationId: { type: string, minLength: 1, maxLength: 128 }
    CustomerAccessTokenIssuanceResult:
      type: object
      required: [customerAccessTokenContractVersion, recordType, payload]
      properties:
        customerAccessTokenContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: customerAccessTokenIssuanceResult }
        payload:
          type: object
          required: [token, metadata, correlationId]
          properties:
            token:
              type: string
              pattern: "^mcat_[A-Za-z0-9_-]{43}$"
              description: The opaque credential. Returned exactly once; Mosaic stores only its SHA-256 digest and can never reproduce it.
            metadata: { $ref: "#/components/schemas/CustomerAccessTokenMetadata" }
            correlationId: { type: string }
    CustomerAccessTokenMetadata:
      type: object
      description: Everything Mosaic knows about a token, which is deliberately everything the token itself does not carry.
      required: [tokenId, projectId, environmentId, billingCustomerId, audience, scopes, issuer, issuedAt, expiresAt, status, tokenPrefix, digestAlgorithm]
      properties:
        tokenId: { type: string, description: "A stable public handle, safe to log and to name in an audit event. It is not the token and cannot be presented as one." }
        projectId: { type: string }
        environmentId: { type: string }
        billingCustomerId: { type: string }
        audience: { type: string, enum: [sdk_sync, server_check] }
        scopes: { type: array, items: { type: string, enum: [entitlements.read, entitlements.sync, restore.request] } }
        issuer: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [active, expired, revoked] }
        revokedAt: { type: string, format: date-time }
        revocationReason: { type: string, enum: [customer_signed_out, identity_changed, operator_revoked, customer_deleted, key_rotated, suspected_compromise, superseded_by_new_token] }
        lastUsedAt: { type: string, format: date-time }
        tokenPrefix: { type: string, const: "mcat_" }
        digestAlgorithm: { type: string, const: sha256 }
    EntitlementSyncRequestRecord:
      type: object
      additionalProperties: false
      required: [authoritativeEntitlementContractVersion, recordType, payload]
      properties:
        authoritativeEntitlementContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: entitlementSyncRequest }
        payload:
          type: object
          additionalProperties: false
          required: [supportedAuthoritativeEntitlementContracts, correlationId]
          properties:
            billingCustomerId: { type: string, description: A hint only. Verified against the token; a mismatch is refused. }
            knownSnapshotVersion: { type: integer, minimum: 1 }
            entityTag: { type: string }
            supportedAuthoritativeEntitlementContracts: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string, enum: ["1"] } }
            requestedEntitlementKeys: { type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: { type: string, pattern: "^[a-z][a-z0-9_.-]*$" } }
            correlationId: { type: string, minLength: 1, maxLength: 128 }
    RestoreRequestRecord:
      type: object
      additionalProperties: false
      description: |
        The Authoritative Entitlement Contract v1 restoreRequest envelope. The normative shape is
        protocol/schema/authoritative-entitlement/v1/restore.schema.json; this declaration exists
        so the operation has a resolvable request schema and is deliberately not a second source
        of truth for the contract.
      required: [authoritativeEntitlementContractVersion, recordType, payload]
      properties:
        authoritativeEntitlementContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: restoreRequest }
        payload:
          type: object
          additionalProperties: false
          required: [storePlatform, providerOutcome, correlationId]
          properties:
            storePlatform: { type: string, enum: [apple_app_store, google_play] }
            providerOutcome: { type: string, enum: [completed, no_purchases_found, cancelled, failed, unsupported, not_attempted], description: What the native restore itself did. Recorded verbatim and never merged into Mosaic's own outcome. }
            observationSubmissionIds: { type: array, items: { type: string, minLength: 1, maxLength: 128 }, description: Observations already submitted for this restore. No provider transaction reference travels on this surface. }
            billingCustomerId: { type: string, maxLength: 128, description: Honoured on the trusted surface only. The SDK surface drops it. }
            correlationId: { type: string, minLength: 1, maxLength: 128 }
    RestoreResultRecord:
      type: object
      description: |
        The Authoritative Entitlement Contract v1 restoreResult envelope. Normative shape:
        protocol/schema/authoritative-entitlement/v1/restore.schema.json.
      required: [authoritativeEntitlementContractVersion, recordType, payload]
      properties:
        authoritativeEntitlementContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: restoreResult }
        payload:
          type: object
          properties:
            restoreId: { type: string }
            billingCustomerId: { type: string, description: Absent while identity is unresolved, which is a first-class restore outcome rather than an error. }
            projectId: { type: string }
            environmentId: { type: string }
            storePlatform: { type: string, enum: [apple_app_store, google_play] }
            outcome: { type: string, enum: [restored, no_additional_purchases, validation_pending, identity_unresolved, product_unresolved, provider_unavailable, failed], description: Mosaic's own answer. `restored` is only ever written together with the accepted snapshot version that demonstrates it. }
            providerOutcome: { type: string, enum: [completed, no_purchases_found, cancelled, failed, unsupported, not_attempted] }
            snapshotVersion: { type: integer, description: The accepted snapshot that reflects the restore. Present only for `restored`, and it is the evidence for that outcome. }
            observedTransactionCount: { type: integer, description: Inputs actually linked, never the number the caller claimed. }
            pendingValidationCount: { type: integer }
            uncertainty:
              type: object
              properties:
                reason: { type: string, enum: [none, provider_unavailable, missing_fact, identity_unresolved, product_unresolved, conflicting_facts, projection_failed, stale_validation, unsupported_provider_state] }
                since: { type: string, format: date-time }
                diagnosticCode: { type: string }
            requestedAt: { type: string, format: date-time }
            completedAt: { type: string, format: date-time }
            correlationId: { type: string }
    CustomerEntitlementSnapshotRecord:
      type: object
      description: |
        The Authoritative Entitlement Contract v1 customerEntitlementSnapshot envelope. The
        normative shape is protocol/schema/authoritative-entitlement/v1/snapshot.schema.json;
        this declaration exists so the operation has a resolvable response schema and is
        deliberately not a second source of truth for the contract.
      required: [authoritativeEntitlementContractVersion, recordType, payload]
      properties:
        authoritativeEntitlementContractVersion: { type: string, const: "1" }
        recordType: { type: string, enum: [customerEntitlementSnapshot, snapshotUnchanged] }
        payload:
          type: object
          properties:
            snapshotId: { type: string }
            billingCustomerId: { type: string }
            projectId: { type: string }
            environmentId: { type: string }
            snapshotVersion: { type: integer, description: Monotonic per (customer, Environment). The sole cache-monotonicity key. A no-change projection does not advance it. }
            previousSnapshotVersion: { type: integer }
            projectionRuleVersion: { type: integer }
            issuedAt: { type: string, format: date-time }
            asOf: { type: string, format: date-time }
            refreshAfter: { type: string, format: date-time }
            validUntil: { type: string, format: date-time }
            staleGraceSeconds: { type: integer, minimum: 0, maximum: 2592000 }
            entityTag: { type: string }
            contentDigest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
            entries: { type: array, items: { $ref: "#/components/schemas/EntitlementEntry" } }
            sources: { type: array, items: { $ref: "#/components/schemas/EntitlementSourceSummary" } }
            projectionStatus: { $ref: "#/components/schemas/ProjectionStatus" }
            changeReason: { type: string }
            correlationId: { type: string }
    EntitlementEntry:
      type: object
      description: Product and Subscription Instance identity are deliberately absent; they live on the contributing source summaries, which sourceIds resolves against.
      required: [entitlementId, entitlementKey, state, endKnown, sourceIds, sourceCount, primaryExplanation]
      properties:
        entitlementId: { type: string }
        entitlementKey: { type: string, pattern: "^[a-z][a-z0-9_.-]*$" }
        state: { type: string, enum: [active, inactive, unknown], description: "`unavailable` is deliberately absent: it describes Mosaic's ability to answer, never the customer's access." }
        effectiveStart: { type: string, format: date-time }
        effectiveEnd: { type: string, format: date-time }
        endKnown: { type: boolean, description: False means an active source has an uncertain end, and a reader must not display or enforce any expiry. }
        sourceIds: { type: array, items: { type: string } }
        sourceCount: { type: integer }
        primaryExplanation: { $ref: "#/components/schemas/PrimaryExplanation" }
        uncertainty: { $ref: "#/components/schemas/Uncertainty" }
    EntitlementSourceSummary:
      type: object
      required: [sourceId, sourceType, mosaicProductId, grantVersionId, sourceSnapshotId, start, sourceState, uncertainty, explanationCode, isTestSource]
      properties:
        sourceId: { type: string, description: Derived from (purchase lineage, Entitlement, grant version) and never from a transaction fact, so a second fact for one purchase cannot double-grant. }
        sourceType: { type: string, enum: [active_subscription, trial, grace_period, billing_retry, one_time_non_consumable, family_shared] }
        subscriptionInstanceId: { type: string }
        oneTimePurchaseInstanceId: { type: string }
        mosaicProductId: { type: string }
        grantVersionId: { type: string }
        sourceSnapshotId: { type: string }
        storePlatform: { type: string, enum: [apple_app_store, google_play] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time, description: Absent means this source has no finite end Mosaic can state. }
        sourceState: { type: string, enum: [granting, not_granting, unknown] }
        uncertainty: { $ref: "#/components/schemas/Uncertainty" }
        explanationCode: { type: string }
        isTestSource: { type: boolean, description: True for an Apple sandbox transaction or a Google Play license-tester purchase, so a test-derived grant is never mistaken for a paid one. }
    ProjectionStatus:
      type: object
      required: [state, lastProjectedAt]
      properties:
        state: { type: string, enum: [current, pending, stale, degraded, failed] }
        lastProjectedAt: { type: string, format: date-time }
        pendingFactCount: { type: integer }
        diagnosticCode: { type: string }
    Uncertainty:
      type: object
      description: Why a state is not definitive. reason `none` means the state is definitive, and a definitive state carries no since instant.
      required: [reason]
      properties:
        reason: { type: string, enum: [none, provider_unavailable, missing_fact, identity_unresolved, product_unresolved, conflicting_facts, projection_failed, stale_validation, unsupported_provider_state] }
        since: { type: string, format: date-time }
        expectedResolution: { type: string, enum: [automatic_retry, next_provider_notification, next_projection_run, operator_action, customer_action, none_expected] }
        diagnosticCode: { type: string }
    PrimaryExplanation:
      type: object
      required: [code]
      properties:
        code: { type: string, description: A member of the contract's closed explanation vocabulary. A reader may render its own copy for a code but must never invent one. }
        sourceId: { type: string }
        safeSummary: { type: string, maxLength: 240 }
    EntitlementCheckRequestRecord:
      type: object
      additionalProperties: false
      required: [authoritativeEntitlementContractVersion, recordType, payload]
      properties:
        authoritativeEntitlementContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: entitlementCheckRequest }
        payload:
          type: object
          additionalProperties: false
          required: [billingCustomerId, entitlementKeys, supportedAuthoritativeEntitlementContracts, correlationId]
          properties:
            billingCustomerId: { type: string }
            entitlementKeys: { type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: { type: string, pattern: "^[a-z][a-z0-9_.-]*$" } }
            expectedSnapshotVersion: { type: integer, minimum: 1 }
            supportedAuthoritativeEntitlementContracts: { type: array, minItems: 1, items: { type: string, enum: ["1"] } }
            correlationId: { type: string, minLength: 1, maxLength: 128 }
    EntitlementCheckResultRecord:
      type: object
      required: [authoritativeEntitlementContractVersion, recordType, payload]
      properties:
        authoritativeEntitlementContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: entitlementCheckResult }
        payload:
          type: object
          required: [billingCustomerId, projectId, environmentId, issuedAt, results, correlationId]
          properties:
            billingCustomerId: { type: string }
            projectId: { type: string }
            environmentId: { type: string }
            snapshotVersion: { type: integer, description: Absent only when no snapshot could be read at all, in which case every result is unavailable. }
            projectionRuleVersion: { type: integer }
            issuedAt: { type: string, format: date-time }
            asOf: { type: string, format: date-time }
            results:
              type: array
              minItems: 1
              items:
                type: object
                required: [entitlementKey, state, sourceCount, endKnown, primaryExplanation]
                properties:
                  entitlementKey: { type: string }
                  state: { type: string, enum: [active, inactive, unknown, unavailable], description: "This is the only place `unavailable` is admissible for an Entitlement: it says Mosaic could not answer, not that the customer lacks access." }
                  effectiveStart: { type: string, format: date-time }
                  effectiveEnd: { type: string, format: date-time }
                  endKnown: { type: boolean }
                  sourceCount: { type: integer }
                  sourceIds: { type: array, items: { type: string } }
                  primaryExplanation: { $ref: "#/components/schemas/PrimaryExplanation" }
                  uncertainty: { $ref: "#/components/schemas/Uncertainty" }
                  isTestSource: { type: boolean }
            projectionStatus: { $ref: "#/components/schemas/ProjectionStatus" }
            correlationId: { type: string }
    SubscriptionSnapshotRecord:
      type: object
      description: |
        The Authoritative Entitlement Contract v1 subscriptionSnapshot envelope. The normative
        shape is protocol/schema/authoritative-entitlement/v1/subscription.schema.json.
      required: [authoritativeEntitlementContractVersion, recordType, payload]
      properties:
        authoritativeEntitlementContractVersion: { type: string, const: "1" }
        recordType: { type: string, const: subscriptionSnapshot }
        payload:
          type: object
          properties:
            subscriptionSnapshotId: { type: string }
            subscriptionInstanceId: { type: string }
            purchaseLineageId: { type: string }
            billingCustomerId: { type: string }
            projectId: { type: string }
            environmentId: { type: string }
            projectionVersion: { type: integer }
            projectionRuleVersion: { type: integer }
            computedAt: { type: string, format: date-time }
            asOf: { type: string, format: date-time }
            storePlatform: { type: string, enum: [apple_app_store, google_play] }
            mosaicProductId: { type: string }
            priorMosaicProductId: { type: string }
            accessState: { type: string, enum: [active, inactive, unknown, unavailable] }
            lifecycleState: { type: string, enum: [trialing, active, grace_period, billing_retry, paused, expired, revoked, refunded, superseded, unknown] }
            renewalIntent: { type: string, enum: [auto_renew_enabled, auto_renew_disabled, provider_managed, paused, unknown] }
            billingState: { type: string, enum: [current, retrying, grace, failed, refunded, revoked, unknown] }
            uncertainty: { $ref: "#/components/schemas/Uncertainty" }
            periodStart: { type: string, format: date-time }
            periodEnd: { type: string, format: date-time }
            gracePeriodEnd: { type: string, format: date-time }
            billingRetryStart: { type: string, format: date-time }
            pauseEffectiveAt: { type: string, format: date-time }
            pauseResumeAt: { type: string, format: date-time }
            cancellationEffectiveAt: { type: string, format: date-time, description: When the provider recorded the cancellation. It changes renewalIntent; it does not end access. }
            expirationEffectiveAt: { type: string, format: date-time }
            revocationEffectiveAt: { type: string, format: date-time }
            refundEffectiveAt: { type: string, format: date-time }
            supersededBySubscriptionInstanceId: { type: string }
            isTestSource: { type: boolean }
            sourceFactCount: { type: integer }
            checksum: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
            changeReason: { type: string }
            explanationCode: { type: string }
            correlationId: { type: string }
    SubscriptionSummary:
      type: object
      properties:
        subscriptionInstanceId: { type: string }
        subscriptionSnapshotId: { type: string }
        projectionVersion: { type: integer }
        accessState: { type: string, enum: [active, inactive, unknown] }
        lifecycleState: { type: string }
        renewalIntent: { type: string }
        billingState: { type: string }
        isTestSource: { type: boolean }
        asOf: { type: string, format: date-time }
    SubscriptionTimelineEntry:
      type: object
      properties:
        timelineEntryId: { type: string }
        entryType: { type: string }
        effectiveAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
        explanationCode: { type: string }
        mosaicProductId: { type: string }
        detail: { type: object, additionalProperties: { type: string } }
    BillingCustomer:
      type: object
      description: "A Billing Customer as the trusted-server API reports it. Alias values never appear: aliases are stored as digests."
      properties:
        billingCustomerId: { type: string }
        projectId: { type: string }
        status: { type: string, enum: [active, frozen, anonymized] }
        diagnosticsStatus: { type: string, enum: [none, identity_conflict, projection_stale, projection_failed] }
        currentProjectionVersion: { type: integer }
        lastProjectedAt: { type: string, format: date-time }
        identified: { type: boolean, description: True when an application backend has named this customer. False means purchase-anchored but never identified. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BillingSettings:
      type: object
      description: Per-Project Mosaic Billing configuration. Off by default.
      properties:
        projectId: { type: string }
        billingEnabled: { type: boolean }
        activeCredentialCount:
          type: integer
          description: Active Store Server Credentials. Disabling is refused while this is above zero.
        canDisable:
          type: boolean
          description: |
            Whether a disable would be accepted right now. False while any Store Server Credential
            is active: revoking the credential is what actually stops the store delivering.
        updatedAt: { type: string, format: date-time }
    BillingHealth:
      type: object
      properties:
        environmentId: { type: string }
        billingEnabled: { type: boolean }
        credentialCount: { type: integer }
        unhealthyCredentials: { type: integer }
        queueDepth: { type: integer, format: int64 }
        oldestQueuedAgeSeconds: { type: number }
        openQuarantineCount: { type: integer, format: int64 }
        factCount: { type: integer, format: int64 }
        lastFactRecordedAt: { type: string, format: date-time }
        lastReconciliationAt: { type: string, format: date-time }
    IdentifyBillingCustomerRequest:
      type: object
      additionalProperties: false
      required: [applicationUserId]
      properties:
        applicationUserId: { type: string, minLength: 1, maxLength: 512, description: Your own identifier for the user. Stored only as a domain-separated SHA-256 digest. }
    AttachBillingCustomerAliasRequest:
      type: object
      additionalProperties: false
      required: [applicationUserId]
      properties:
        applicationUserId: { type: string, minLength: 1, maxLength: 512 }
    BillingIdentityCustomer:
      type: object
      properties:
        billingCustomerId: { type: string }
        projectId: { type: string }
        status: { type: string, enum: [active, frozen, anonymized] }
        diagnosticsStatus: { type: string }
        currentProjectionVersion: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastProjectedAt: { type: string, format: date-time }
    BillingCustomerAlias:
      type: object
      description: An alias record. The alias digest is never a member of this shape.
      properties:
        aliasId: { type: string }
        billingCustomerId: { type: string }
        aliasType: { type: string, enum: [application_user_id, installation_id, apple_app_account_token, google_obfuscated_account_id] }
        sourceAuthority: { type: string }
        verificationStatus: { type: string }
        effectiveStart: { type: string, format: date-time }
        effectiveEnd: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    BillingIdentityConflict:
      type: object
      properties:
        conflictId: { type: string }
        projectId: { type: string }
        scope: { type: string, enum: [lineage, alias] }
        status: { type: string, enum: [open, resolved] }
        firstCustomerId: { type: string, description: The incumbent. }
        secondCustomerId: { type: string, description: The challenger. }
        purchaseLineageId: { type: string, description: Present only for a lineage-scoped conflict. }
        aliasType: { type: string, description: Present only for an alias-scoped conflict. The digest is never reported. }
        diagnosticCode: { type: string }
        openedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        resolutionAction: { type: string, enum: [assigned_first, assigned_second, detached_both] }
    BillingIdentityConflictDetail:
      type: object
      properties:
        conflict: { $ref: "#/components/schemas/BillingIdentityConflict" }
        lineage:
          type: object
          description: The disputed Purchase Lineage, for a lineage-scoped conflict.
          properties:
            purchaseLineageId: { type: string }
            environmentId: { type: string }
            provider: { type: string, enum: [app_store, google_play] }
            storeEnvironment: { type: string, enum: [sandbox, production] }
            lineageType: { type: string, enum: [subscription, one_time] }
            projectionFrozen: { type: boolean }
            diagnosticStatus: { type: string }
    BillingSyncRequest:
      type: object
      properties:
        billingCustomerId: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        projectionScopeKey: { type: string }
        triggerKind: { type: string, enum: [manual_sync] }
        requestedAt: { type: string, format: date-time }
        status: { type: string, enum: [queued] }
    CreateProjectionReplayRequest:
      type: object
      additionalProperties: false
      description: Must be bounded by at least one of subscriptionInstanceId, billingCustomerId, or a complete window.
      properties:
        subscriptionInstanceId: { type: string, maxLength: 128 }
        billingCustomerId: { type: string, maxLength: 128 }
        windowStart: { type: string, format: date-time, description: Bounds on facts rather than on lineage creation - a scope is in scope when it holds a fact whose effective or recorded time falls inside the window. }
        windowEnd: { type: string, format: date-time }
        projectionRuleVersion: { type: integer, minimum: 0, maximum: 1000000, description: Zero selects the active version. A version this build does not derive under is refused rather than approximated. }
        limit: { type: integer, minimum: 0, maximum: 500 }
    ProjectionReplayResult:
      type: object
      properties:
        projectionRuleVersion: { type: integer }
        scopesReplayed: { type: integer }
        scopesChanged: { type: integer }
        outcomes:
          type: array
          items:
            type: object
            properties:
              projectionScopeKey: { type: string }
              comparison: { type: string, enum: [unchanged, changed], description: The whole point of a replay - proving determinism, or naming exactly what a rule change moved. }
              materialized: { type: boolean, description: Whether a new snapshot was written. Materialization is changes-only, so an unchanged scope writes nothing. }
              changedEntitlementIds: { type: array, items: { type: string } }
    ProductEntitlementGrantVersion:
      type: object
      description: One immutable Product-to-Entitlement grant interval. Half-open - [effectiveStart, effectiveEnd).
      properties:
        grantVersionId: { type: string }
        projectId: { type: string }
        productId: { type: string }
        productKey: { type: string }
        entitlementId: { type: string }
        entitlementKey: { type: string }
        version: { type: integer, minimum: 1, description: Monotonic per (Product, Entitlement) pair. }
        grantPolicyVersion: { type: integer, description: The access-policy vocabulary this version was written under, so a later vocabulary cannot silently reinterpret what an operator approved. }
        effectiveStart: { type: string, format: date-time }
        effectiveEnd: { type: string, format: date-time, description: Absent on the current version. Set once, to the successor's start, and never moved. }
        current: { type: boolean }
        retroactive: { type: boolean, description: Derived from effectiveStart preceding createdAt - a version whose meaning began before it existed was backdated. }
        supportedPurchaseTypes: { type: array, items: { type: string, enum: [auto_renewable_subscription, non_consumable] } }
        accessPolicy: { $ref: "#/components/schemas/GrantAccessPolicy" }
        createdAt: { type: string, format: date-time }
        createdByActorId: { type: string }
        reason: { type: string }
    GrantAccessPolicy:
      type: object
      description: Which subscription states this grant treats as granting access (plan policy version 1).
      properties:
        grantsInActive: { type: boolean }
        grantsInTrial: { type: boolean }
        grantsInGrace: { type: boolean, description: Both providers grant access during grace, so the default is true. }
        grantsInBillingRetry: { type: boolean, description: Contradicts both providers' documentation. Closed by default and settable only by an organization owner. }
        grantsInPaused: { type: boolean, description: Always false. Google's pause never grants access and the policy is not overridable. }
        grantsInOneTimeOwnership: { type: boolean }
    PublishGrantVersionRequest:
      type: object
      required: [productId, entitlementId, effectiveStart]
      description: |
        A proposed grant version. The same body is accepted by the impact preview and by publish,
        so what is previewed is what is published. Omitted policy flags take their documented
        defaults rather than false - a missing grantsInActive defaulting to false would publish a
        version granting nothing during an active subscription, the opposite of what an operator
        leaving the field out meant.
      properties:
        productId: { type: string, maxLength: 128 }
        entitlementId: { type: string, maxLength: 128 }
        effectiveStart: { type: string, format: date-time, description: Now or later unless retroactive is true. }
        retroactive: { type: boolean, default: false, description: Backdate the change. Held to the additive-superset rule and confined to the currently open interval. }
        supportedPurchaseTypes: { type: array, maxItems: 4, items: { type: string, enum: [auto_renewable_subscription, non_consumable] } }
        grantsInActive: { type: boolean, default: true }
        grantsInTrial: { type: boolean, default: true }
        grantsInGrace: { type: boolean, default: true }
        grantsInBillingRetry: { type: boolean, default: false }
        grantsInPaused: { type: boolean, default: false, description: Accepted only so it can be refused with 422. }
        grantsInOneTimeOwnership: { type: boolean, default: true }
        reason: { type: string, maxLength: 512, description: Required to publish. It is what an investigation reads months later, when the operator who published is gone and the only remaining question is why access changed. }
    GrantVersionImpact:
      type: object
      description: Read-only counts of what a proposed grant change would touch, from current committed state.
      properties:
        productId: { type: string }
        entitlementId: { type: string }
        impactedProducts: { type: integer, description: Products a reprojection of the affected customers would re-derive. }
        impactedEntitlements: { type: integer, description: Entitlements a reprojection of the affected customers would re-derive. }
        impactedCustomers: { type: integer, description: Billing Customers whose current snapshot cites this Product. }
        impactedActiveSources: { type: integer, description: How many of those citations are currently granting access - the number that answers how many people could lose access. }
        impactedLineages: { type: integer, description: Purchase lineages resolved to this Product, including ones with no customer resolved yet. }
        retroactive: { type: boolean }
        additiveSuperset: { type: boolean, description: Whether the proposal passes the widen-only rule. Meaningful for a retroactive change; a preview reports it, the publish enforces it. }
        narrowingCode: { type: string, description: The first narrowing found when additiveSuperset is false, in the projection engine's own vocabulary. }
        currentVersion: { $ref: "#/components/schemas/ProductEntitlementGrantVersion" }
        observedAt: { type: string, format: date-time }
    WebhookDestination:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        url: { type: string, description: HTTPS only. Screened against the resolved address at registration and again on every delivery attempt. }
        status: { type: string, enum: [active, paused, disabled] }
        eventTypes: { type: array, items: { type: string, enum: [customer.entitlements.changed] }, description: Phase 9B emits one event type. The other nine the contract declares are reserved names. }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        secretLastRotatedAt: { type: string, format: date-time }
        disabledReason: { type: string, description: What an operator wrote when they disabled it by hand. }
        consecutiveFailureCount: { type: integer, description: Exhausted deliveries in a row. Any success resets it, so a recovering outage never trips the auto-disable policy. }
        autoDisabledAt: { type: string, format: date-time }
        autoDisableReason: { type: string, enum: [consecutive_exhausted_deliveries, destination_refused], description: Set only by the automatic path, so a Mosaic disable is distinguishable from a human one. }
    WebhookDestinationWithSecret:
      type: object
      properties:
        destination: { $ref: "#/components/schemas/WebhookDestination" }
        secret: { type: string, description: Displayed exactly once. Mosaic keeps only the sealed form, so no read returns it again. }
        secretId: { type: string }
        previousSecretHonoredUntil: { type: string, format: date-time, description: Set by a rotation. Until this instant the superseded secret still signs. Absent on a create, which has no previous secret. }
    WebhookSigningSecretMetadata:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [active, retired] }
        createdAt: { type: string, format: date-time }
        retiredAt: { type: string, format: date-time }
        honoredUntil: { type: string, format: date-time, description: A retired secret keeps signing until this instant, which is the rotation overlap window. }
    CreateWebhookDestinationRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 2048 }
        eventTypes: { type: array, maxItems: 10, items: { type: string, enum: [customer.entitlements.changed] } }
        description: { type: string, maxLength: 500 }
    UpdateWebhookDestinationRequest:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1, maxLength: 2048 }
        eventTypes: { type: array, maxItems: 10, items: { type: string, enum: [customer.entitlements.changed] } }
        description: { type: string, maxLength: 500 }
    SetWebhookDestinationStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [active, paused, disabled] }
        reason: { type: string, maxLength: 128 }
    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        eventId: { type: string, description: Stable across every attempt and every manual replay. It is the consumer's deduplication key. }
        destinationId: { type: string }
        status: { type: string, enum: [pending, succeeded, failed, exhausted, skipped] }
        skippedReason: { type: string, enum: [destination_disabled, event_type_not_enabled, destination_deleted, tenant_suspended] }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    WebhookDeliveryAttempt:
      type: object
      description: |
        One recorded try. Mirrors the Billing State Webhook Contract v1 webhookDeliveryAttempt
        record; the normative shape is protocol/schema/billing-state-webhook/v1/delivery.schema.json.
      properties:
        id: { type: string }
        deliveryId: { type: string }
        eventId: { type: string }
        destinationId: { type: string }
        attempt: { type: integer, minimum: 1, maximum: 32 }
        maxAttempts: { type: integer, minimum: 1, maximum: 32 }
        outcome: { type: string, enum: [delivered, retryable_failure, permanent_failure, exhausted, skipped] }
        responseStatusCode: { type: integer, minimum: 100, maximum: 599 }
        responseExcerpt: { type: string, maxLength: 240, description: Bounded and control-character-free. Never parsed, never influences Mosaic state. }
        errorCode: { type: string }
        latencyMs: { type: integer }
        skippedReason: { type: string, enum: [destination_disabled, event_type_not_enabled, destination_deleted, tenant_suspended] }
        requestedAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
    BillingProjectionHealth:
      type: object
      properties:
        environmentId: { type: string }
        billingEnabled: { type: boolean }
        activeProjectionRuleVersion: { type: integer, description: The rule version new projections are computed under. }
        projectionRuleVersionCount: { type: integer, description: A count above one with no replay in flight means a promotion was prepared and never run. }
        projectionQueueDepth: { type: integer, format: int64 }
        projectionOldestQueuedAgeSeconds: { type: number, description: The alerting signal. Depth alone cannot distinguish a busy queue from a stuck one. }
        projectionFailedJobs: { type: integer, format: int64 }
        projectionFailuresLastHour: { type: integer, format: int64, description: A rate signal the queue depth cannot give, because a scope that fails and requeues forever keeps the depth at one. }
        staleCustomers: { type: integer, format: int64, description: Customers whose committed state in this Environment is older than the staleness threshold. }
        neverProjectedCustomers: { type: integer, format: int64 }
        openIdentityConflicts: { type: integer, format: int64, description: A spike here is a security-relevant signal, not a backlog. }
        frozenLineages: { type: integer, format: int64 }
        unresolvedLineages: { type: integer, format: int64 }
        unknownEntitlementEntries: { type: integer, format: int64, description: Entries on current snapshots stating unknown - how often Mosaic is declining to answer. }
        restoreBacklog: { type: integer, format: int64 }
        restoreFailedJobs: { type: integer, format: int64 }
        webhookDeliveryBacklog: { type: integer, format: int64 }
        webhookDeliveriesExhausted: { type: integer, format: int64 }
        activeWebhookDestinations: { type: integer, format: int64 }
        lastProjectionCommittedAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
    BillingCustomerSummary:
      type: object
      description: |
        One Billing Customer as the operator list and the detail header report it. It carries no
        alias value and no alias digest, because Mosaic exposes neither on any surface.
      properties:
        billingCustomerId: { type: string }
        projectId: { type: string }
        environmentId: { type: string }
        status: { type: string, enum: [active, frozen, anonymized] }
        diagnosticsStatus: { type: string, enum: [none, identity_conflict, projection_stale, projection_failed] }
        identified: { type: boolean, description: An active application-user alias exists - a person is attached. }
        purchaseAnchored: { type: boolean, description: A purchase lineage exists in this Environment - revenue is attached. }
        hasOpenIdentityConflict: { type: boolean }
        frozenLineageCount: { type: integer }
        currentProjectionVersion: { type: integer, format: int64 }
        lastProjectedAt: { type: string, format: date-time }
        snapshotVersion: { type: integer, format: int64, description: "Absent when the customer has never been projected in this Environment, which is not the same as having no entitlements." }
        snapshotUpdatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BillingCustomerLookupRequest:
      type: object
      additionalProperties: false
      required: [identifierType, identifierValue]
      properties:
        identifierType: { type: string, enum: [billing_customer_id, application_user_id, installation_id] }
        identifierValue:
          type: string
          minLength: 1
          maxLength: 512
          description: The raw identifier. It is digested server-side and is never stored, never logged, and never echoed back.
    BillingCustomerLookupResult:
      type: object
      properties:
        found: { type: boolean }
        customer: { $ref: "#/components/schemas/BillingCustomerSummary" }
    OperatorBillingCustomerAlias:
      type: object
      description: |
        One accepted external identity bound to a customer, as a protected representation. There
        is no value field and no digest field: the alias id identifies the row for a revocation
        and reveals nothing about the person, whereas an alias digest is still a stable
        per-person identifier.
      properties:
        aliasId: { type: string }
        aliasType: { type: string, enum: [application_user_id, installation_id, apple_app_account_token, google_obfuscated_account_id] }
        sourceAuthority: { type: string, enum: [trusted_server, sdk_installation, provider_payload, operator, restore] }
        verificationStatus: { type: string, enum: [asserted, verified] }
        active: { type: boolean }
        effectiveStart: { type: string, format: date-time }
        effectiveEnd: { type: string, format: date-time }
    BillingPurchaseLineage:
      type: object
      description: One provider purchase chain. Supersession is an explicit edge; nothing is ever deleted.
      properties:
        purchaseLineageId: { type: string }
        environmentId: { type: string }
        provider: { type: string, enum: [app_store, google_play] }
        storeEnvironment: { type: string, enum: [sandbox, production] }
        lineageType: { type: string, enum: [subscription, one_time] }
        projectionFrozen: { type: boolean, description: Set while an identity conflict is open - the projector skips it and the last committed state is preserved. }
        diagnosticStatus: { type: string, enum: [none, identity_unresolved, identity_conflict, product_unresolved] }
        supersededByLineageId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BillingOneTimePurchase:
      type: object
      description: Validated ownership of a non-consumable. Consumables are excluded from Mosaic Billing.
      properties:
        oneTimePurchaseInstanceId: { type: string }
        purchaseLineageId: { type: string }
        provider: { type: string, enum: [app_store, google_play] }
        mosaicProductId: { type: string }
        providerProductIdentifier: { type: string }
        acquiredAt: { type: string, format: date-time }
        validityState: { type: string, enum: [owned, refunded, revoked, unknown] }
        refundEffectiveAt: { type: string, format: date-time }
        revocationEffectiveAt: { type: string, format: date-time }
    BillingProjectionStatus:
      type: object
      properties:
        state: { type: string, enum: [current, pending, stale, degraded, failed] }
        lastProjectedAt: { type: string, format: date-time }
        pendingFactCount: { type: integer }
        diagnosticCode: { type: string }
    BillingEntitlementSnapshotEntry:
      type: object
      properties:
        entitlementId: { type: string }
        entitlementKey: { type: string }
        state: { type: string, enum: [active, inactive, unknown], description: unavailable is a read-time service state and is never persisted on a snapshot. }
        effectiveStart: { type: string, format: date-time }
        effectiveEnd: { type: string, format: date-time }
        endKnown: { type: boolean }
        sourceCount: { type: integer }
        uncertaintyReason: { type: string, enum: [none, provider_unavailable, missing_fact, identity_unresolved, product_unresolved, conflicting_facts, projection_failed, stale_validation, unsupported_provider_state] }
        isTestSource: { type: boolean }
        explanationCode: { type: string }
        sourceIds: { type: array, items: { type: string } }
    BillingEntitlementSource:
      type: object
      description: |
        One reason the customer holds, or may hold, an Entitlement. Source identity is
        (purchase lineage, product, grant version) and never a fact id, so multiple facts
        describing one purchase cannot double-grant.
      properties:
        sourceId: { type: string }
        entitlementId: { type: string }
        purchaseLineageId: { type: string }
        mosaicProductId: { type: string }
        grantVersionId: { type: string }
        subscriptionInstanceId: { type: string }
        oneTimePurchaseInstanceId: { type: string }
        storePlatform: { type: string }
        sourceType: { type: string }
        sourceState: { type: string }
        sourceStart: { type: string, format: date-time }
        sourceEnd: { type: string, format: date-time }
        endKnown: { type: boolean }
        uncertaintyReason: { type: string }
        isTestSource: { type: boolean }
        explanationCode: { type: string }
    BillingEntitlementSnapshot:
      type: object
      properties:
        snapshotId: { type: string }
        snapshotVersion: { type: integer, format: int64, description: Per-customer monotonic. It is the sole cache-monotonicity key; a no-change projection does not advance it. }
        previousSnapshotVersion: { type: integer, format: int64 }
        projectionRuleVersion: { type: integer }
        computedAt: { type: string, format: date-time }
        asOf: { type: string, format: date-time }
        changeReason: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/BillingEntitlementSnapshotEntry" } }
        sources: { type: array, items: { $ref: "#/components/schemas/BillingEntitlementSource" } }
    BillingSubscriptionSnapshot:
      type: object
      description: |
        One projected Subscription Instance. Access and lifecycle are separate axes on purpose:
        a cancelled subscription keeps access until its validated period end, so cancellation
        moves renewal intent and nothing else.
      properties:
        subscriptionInstanceId: { type: string }
        purchaseLineageId: { type: string }
        billingCustomerId: { type: string }
        environmentId: { type: string }
        storePlatform: { type: string }
        mosaicProductId: { type: string }
        priorMosaicProductId: { type: string }
        accessState: { type: string, enum: [active, inactive, unknown], description: unavailable is a read-time service state and is never persisted on a snapshot. }
        lifecycleState: { type: string, enum: [trialing, active, grace_period, billing_retry, paused, expired, revoked, refunded, superseded, unknown] }
        renewalIntent: { type: string }
        billingState: { type: string }
        uncertaintyReason: { type: string }
        projectionVersion: { type: integer, format: int64 }
        projectionRuleVersion: { type: integer }
        computedAt: { type: string, format: date-time }
