openapi: 3.1.0
info:
  title: Mosaic API
  version: 0.7.0-phase7
  description: |
    Hosted workspace, provider foundation, publishing, Asset, browser-session, and SDK-delivery API.
    RevenueCat server-connected integrations use least-privilege v2 secret keys. Secrets
    are accepted only on create, rotate, and reconnect and are never returned.
servers:
  - url: /
security:
  - BrowserSession: []
paths:
  /health/live:
    get:
      security: []
      operationId: getHealth
      tags: [Lifecycle]
      responses:
        "200":
          description: Process liveness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
  /health/ready:
    get:
      security: []
      operationId: getReadiness
      tags: [Lifecycle]
      responses:
        "200":
          description: PostgreSQL is reachable and the API is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/auth/signup:
    post:
      security: []
      operationId: signUp
      tags: [Authentication]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SignUpRequest" } } } }
      responses:
        "201": { $ref: "#/components/responses/UserSession" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      security: []
      operationId: login
      tags: [Authentication]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/UserSession" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      responses:
        "204": { description: Session revoked and cookie cleared. }
  /v1/auth/session:
    get:
      operationId: getSession
      tags: [Authentication]
      responses:
        "200": { $ref: "#/components/responses/UserSession" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/organizations:
    get:
      operationId: listOrganizations
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OrganizationList" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: createOrganization
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "201": { $ref: "#/components/responses/Organization" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: getOrganization
      tags: [Organizations]
      responses:
        "200": { $ref: "#/components/responses/Organization" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateOrganization
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200": { $ref: "#/components/responses/Organization" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/organizations/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: listMembers
      tags: [Members]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/MembershipList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: addMember
      tags: [Members]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201": { $ref: "#/components/responses/Membership" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/organizations/{organizationId}/members/{actorId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/ActorID"
    patch:
      operationId: updateMember
      tags: [Members]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "200": { $ref: "#/components/responses/Membership" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      tags: [Members]
      responses:
        "204": { description: Member removed. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/organizations/{organizationId}/audit-events:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: listAuditEvents
      tags: [Audit]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AuditEventList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/projects:
    get:
      operationId: listProjects
      tags: [Projects]
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ProjectStatus" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/ProjectList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201": { $ref: "#/components/responses/Project" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: getProject
      tags: [Projects]
      responses:
        "200": { $ref: "#/components/responses/Project" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNameRequest" }
      responses:
        "200": { $ref: "#/components/responses/Project" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      operationId: archiveProject
      tags: [Projects]
      responses:
        "200": { $ref: "#/components/responses/Project" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      operationId: restoreProject
      tags: [Projects]
      responses:
        "200": { $ref: "#/components/responses/Project" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/applications:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listApplications
      tags: [Applications]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/ApplicationList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createApplication
      tags: [Applications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationRequest" }
      responses:
        "201": { $ref: "#/components/responses/Application" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/environments:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listEnvironments
      tags: [Environments]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/EnvironmentList" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/provider-connections:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listProviderConnections
      tags: [Provider Connections]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/ProviderConnectionList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProviderConnection
      tags: [Provider Connections]
      description: |
        Creates a RevenueCat v2 connection with explicit Environment/Application scopes
        and a one-time least-privilege secret key. The secret is encrypted at rest and
        never returned. Custom SDK-local connections do not accept a credential.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProviderConnectionRequest" }
      responses:
        "201": { $ref: "#/components/responses/ProviderConnection" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/provider-imports:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: importProviderProducts
      tags: [Provider Imports]
      description: Imports selected live-catalog Products and optional Entitlements with item-level results.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderImportRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProviderImportResult" }
        default: { $ref: "#/components/responses/Error" }
  /v1/environments/{environmentId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
    get:
      operationId: listAPIKeys
      tags: [API Keys]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: kind
          schema: { $ref: "#/components/schemas/APIKeyKind" }
        - in: query
          name: state
          schema: { type: string, enum: [active, revoked] }
      responses:
        "200": { $ref: "#/components/responses/APIKeyList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAPIKey
      tags: [API Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAPIKeyRequest" }
      responses:
        "201": { $ref: "#/components/responses/APIKeySecret" }
        default: { $ref: "#/components/responses/Error" }
  /v1/environments/{environmentId}:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
    patch:
      operationId: updateEnvironment
      tags: [Environments]
      description: Updates the display name; the Environment key is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNameRequest" }
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        default: { $ref: "#/components/responses/Error" }
  /v1/environments/{environmentId}/mode:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
    put:
      operationId: setEnvironmentMode
      tags: [Environments]
      description: Sets the explicit Environment mode without inferring it from a name or key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetEnvironmentModeRequest" }
      responses:
        "200": { $ref: "#/components/responses/Environment" }
        default: { $ref: "#/components/responses/Error" }
  /v1/environments/{environmentId}/applications/{applicationId}/active-provider:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
      - $ref: "#/components/parameters/ApplicationID"
    get:
      operationId: getActiveProviderAssignment
      tags: [Provider Assignments]
      responses:
        "200": { $ref: "#/components/responses/ProviderAssignment" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setActiveProviderAssignment
      tags: [Provider Assignments]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetProviderAssignmentRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProviderAssignment" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: clearActiveProviderAssignment
      tags: [Provider Assignments]
      responses:
        "204": { description: The current assignment was cleared; its audit history remains immutable. }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    get:
      operationId: getProviderConnection
      tags: [Provider Connections]
      responses:
        "200": { $ref: "#/components/responses/ProviderConnection" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/scopes:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    put:
      operationId: replaceProviderConnectionScopes
      tags: [Provider Connections]
      description: Replaces explicit scopes. Scopes used by a current assignment or non-archived mapping cannot be removed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceProviderConnectionScopesRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProviderConnection" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/revoke:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    post:
      operationId: revokeProviderConnection
      tags: [Provider Connections]
      description: Revokes the connection without deleting assignments, mappings, metadata history, or audit evidence.
      responses:
        "200": { $ref: "#/components/responses/ProviderConnection" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/test:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    post:
      operationId: testProviderConnection
      tags: [Provider Connections]
      responses:
        "200": { $ref: "#/components/responses/ProviderConnectionHealth" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/health:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    get:
      operationId: getProviderConnectionHealth
      tags: [Provider Connections]
      responses:
        "200": { $ref: "#/components/responses/ProviderConnectionHealth" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/capabilities:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    get:
      operationId: getProviderConnectionCapabilities
      tags: [Provider Connections]
      responses:
        "200": { $ref: "#/components/responses/ProviderConnectionCapabilities" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/diagnostics:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    get:
      operationId: listProviderConnectionDiagnostics
      tags: [Provider Connections]
      responses:
        "200": { $ref: "#/components/responses/ProviderDiagnostics" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/catalog-preview:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    get:
      operationId: previewProviderCatalog
      tags: [Provider Imports]
      responses:
        "200": { $ref: "#/components/responses/ProviderCatalogPreview" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/rotate-credential:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    post:
      operationId: rotateProviderCredential
      tags: [Provider Connections]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCredentialRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProviderConnection" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/reconnect:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    post:
      operationId: reconnectProviderConnection
      tags: [Provider Connections]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderCredentialRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProviderConnection" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/sync:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    post:
      operationId: enqueueProviderSync
      tags: [Provider Synchronization]
      responses:
        "202": { $ref: "#/components/responses/ProviderSyncJob" }
        default: { $ref: "#/components/responses/Error" }
  /v1/provider-connections/{connectionId}/sync-runs:
    parameters:
      - $ref: "#/components/parameters/ProviderConnectionID"
    get:
      operationId: listProviderSyncRuns
      tags: [Provider Synchronization]
      responses:
        "200": { $ref: "#/components/responses/ProviderSyncRuns" }
        default: { $ref: "#/components/responses/Error" }
  /v1/api-keys/{apiKeyId}/rotate:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    post:
      operationId: rotateAPIKey
      tags: [API Keys]
      responses:
        "200": { $ref: "#/components/responses/APIKeySecret" }
        default: { $ref: "#/components/responses/Error" }
  /v1/api-keys/{apiKeyId}/revoke:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    post:
      operationId: revokeAPIKey
      tags: [API Keys]
      responses:
        "200": { $ref: "#/components/responses/APIKey" }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/plans:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listPlans
      tags: [Plans]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/PlanList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPlan
      tags: [Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCatalogResourceRequest" }
      responses:
        "201": { $ref: "#/components/responses/Plan" }
        default: { $ref: "#/components/responses/Error" }
  /v1/plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanID"
    get:
      operationId: getPlan
      tags: [Plans]
      responses:
        "200": { $ref: "#/components/responses/Plan" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePlan
      tags: [Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCatalogResourceRequest" }
      responses:
        "200": { $ref: "#/components/responses/Plan" }
        default: { $ref: "#/components/responses/Error" }
  /v1/plans/{planId}/products:
    parameters:
      - $ref: "#/components/parameters/PlanID"
    get:
      operationId: listPlanProducts
      tags: [Plans]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/ProductList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: addPlanProduct
      tags: [Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductReferenceRequest" }
      responses:
        "201": { $ref: "#/components/responses/PlanProduct" }
        default: { $ref: "#/components/responses/Error" }
  /v1/plans/{planId}/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/PlanID"
      - $ref: "#/components/parameters/ProductID"
    delete:
      operationId: removePlanProduct
      tags: [Plans]
      responses:
        "204": { description: Product removed from Plan. }
        default: { $ref: "#/components/responses/Error" }
  /v1/projects/{projectId}/products:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listProducts
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ProductStatus" }
        - in: query
          name: type
          schema: { $ref: "#/components/schemas/ProductType" }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/ProductList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201": { $ref: "#/components/responses/Product" }
        default: { $ref: "#/components/responses/Error" }
  /v1/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: getProduct
      tags: [Products]
      responses:
        "200": { $ref: "#/components/responses/Product" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "200": { $ref: "#/components/responses/Product" }
        default: { $ref: "#/components/responses/Error" }
