          maxLength: 255
          pattern: ".*\\S.*"
          description: Opaque provider catalog resource identifier.
        providerPackageIdentifier:
          type: string
          maxLength: 255
          pattern: ".*\\S.*"
          description: RevenueCat-only metadata; requires providerOfferingIdentifier.
        providerOfferingIdentifier:
          type: string
          maxLength: 255
          pattern: ".*\\S.*"
