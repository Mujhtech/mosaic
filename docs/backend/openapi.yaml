      required: [id, environmentId, kind, prefix, createdByActorId, createdAt]
      properties:
        id: { type: string }
        environmentId: { type: string }
        kind: { $ref: "#/components/schemas/APIKeyKind" }
        prefix: { type: string }
        createdByActorId: { type: string }
