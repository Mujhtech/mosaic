name: mosaic_flutter_example
description: Mosaic Phase 2 Flutter local-preview client and native renderer.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  mosaic_sdk:
    path: ../../sdk/flutter
  mosaic_revenuecat:
    path: ../../sdk/flutter/packages/mosaic_revenuecat
  purchases_flutter: 10.4.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/generated/
